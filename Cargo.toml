[workspace]
resolver = "3"
members = [
    "crates/artosia",
    "crates/artosia-core",
    "crates/artosia-listen",
    "crates/artosia-lyrics",
    "crates/artosia-office",
    "crates/artosia-output",
    "crates/artosia-remote",
    "crates/artosia-setup",
    "crates/artosia-slides",
    "crates/artosia-stream",
    "crates/artosia-update",
    "crates/artosia-video",
    "crates/artosia-warp",
]
# A bare `cargo build` skips artosia-video, the only crate that needs GStreamer's development
# files; build it with `-p artosia-output --features video` where GStreamer is installed.
default-members = [
    "crates/artosia",
    "crates/artosia-core",
    "crates/artosia-output",
    "crates/artosia-remote",
    "crates/artosia-slides",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Rune is pre-release: pin a `dev` rev and bump it on purpose (see .claude/rules/rune.md).
rune = { git = "https://github.com/anomalyco/rune", rev = "70eff81165e9854834a75f17753edb6c96ab2ab7" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "70eff81165e9854834a75f17753edb6c96ab2ab7" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
debug = false

# The tempo tracker runs an FFT every 5 ms: unoptimised it is too slow for its own accuracy test.
[profile.dev.package.artosia-listen]
opt-level = 3

# The setup is a small download for strangers, so its size is a feature (Velopack's setup uses
# opt-level z, lto and one codegen unit for the same reason). Cargo lets a package override
# opt-level, codegen-units, strip, debug, debug-assertions, overflow-checks, incremental and
# split-debuginfo, and refuses lto, panic and rpath there: those belong to the whole link.
[profile.release.package.artosia-setup]
opt-level = "z"
codegen-units = 1
strip = true
debug = false

# `cargo build --profile setup -p artosia-setup` is the build of Artosia-setup.exe: the whole
# graph the setup links (the updater, ureq, rustls, windows) built for size. The release
# profile above stays as it is for every other program.
[profile.setup]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
