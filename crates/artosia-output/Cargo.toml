[package]
name = "artosia-output"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "The renderer process: draws the projector and stage windows, so an operator crash cannot black out the screens."

[features]
# Looping video backgrounds through GStreamer. Off, the output still shows colours and pictures.
video = ["dep:artosia-video"]

[dependencies]
artosia-core = { path = "../artosia-core" }
artosia-slides = { path = "../artosia-slides" }
artosia-video = { path = "../artosia-video", optional = true }
artosia-warp = { path = "../artosia-warp" }
rune.workspace = true
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
# Lists the screens again when they change; Rune lists them only at start.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
