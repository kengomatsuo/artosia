[package]
name = "artosia-warp"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Corner pin and colour correction for the projector picture."

[dependencies]
artosia-slides = { path = "../artosia-slides" }
rune.workspace = true
# Same version and features as Rune's own, so the two unify into one wgpu.
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "wgsl"] }

[lints]
workspace = true
