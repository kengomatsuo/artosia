[package]
name = "artosia-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Artosia's library, search, Bible and service plan. No UI."

[dependencies]
artosia-locale = { path = "../artosia-locale" }
flate2 = "1.1.11"
quick-xml = "0.42.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
