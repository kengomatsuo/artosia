[package]
name = "artosia-stream"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Sending the projector picture and the room's sound to a streaming service."

[[bin]]
name = "artosia-stream"
path = "src/main.rs"

[dependencies]
gstreamer = { version = "0.25.4", features = ["v1_20"] }
gstreamer-app = { version = "0.25.2", features = ["v1_20"] }
gstreamer-video = "0.25"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt"] }
libc = "0.2"
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"

[lints]
workspace = true
