[package]
name = "artosia"
version = "0.1.14"
edition.workspace = true
license.workspace = true
description = "Artosia's operator window."

[features]
# Speech recognition (whisper.cpp). Off by default: building it needs CMake and LLVM, and the
# operator must build on a machine without them. `tools/speech-env.sh` finds both.
speech = ["artosia-listen/whisper"]

[dependencies]
artosia-listen = { path = "../artosia-listen" }
artosia-lyrics = { path = "../artosia-lyrics" }
artosia-office = { path = "../artosia-office" }
artosia-core = { path = "../artosia-core" }
artosia-remote = { path = "../artosia-remote" }
artosia-slides = { path = "../artosia-slides" }
artosia-update = { path = "../artosia-update" }
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5"

# Windows only: the elevated command that adds the phone remote's firewall rule (`firewall.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Windows only: puts Artosia's mark on the program file.
[build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
