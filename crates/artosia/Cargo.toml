[package]
name = "artosia"
version = "0.1.2"
edition.workspace = true
license.workspace = true
description = "Artosia's operator window."

[dependencies]
artosia-listen = { path = "../artosia-listen" }
artosia-lyrics = { path = "../artosia-lyrics" }
artosia-office = { path = "../artosia-office" }
artosia-core = { path = "../artosia-core" }
artosia-remote = { path = "../artosia-remote" }
artosia-slides = { path = "../artosia-slides" }
artosia-update = { path = "../artosia-update" }
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5"

# Windows only: puts Artosia's mark on the program file.
[build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
