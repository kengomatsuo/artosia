<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Artosia remote, FreeShow look</title>
<style>
/* Direction: FreeShow's remote. Tokens from github/code/FreeShow--remote_App.svelte (--primary #242832 family,
   --secondary #f0008c, system font), buttons from FreeShow--MaterialButton.svelte (4px radius, outlined and
   contained), the slide page from FreeShow--remote_pages_Slide.svelte, the grid from FreeShow--remote_show_Slides.svelte
   (1 to 3 columns here), the Clear strip from FreeShow--remote_show_Clear.svelte, layout from products/51 and 53:
   back arrow, two-line title, search icon, a control row, a strip above five icon-only tabs. */
:root {
  --primary: #242832; --lighter: #2f3542; --darker: #191923; --darkest: #12121c; --raised: #3a3f4b;
  --text: #f0f0ff; --muted: #b3b6c6; --faint: #8f93a6;
  --secondary: #f0008c; --secondary-fill: #c4006f; --on-secondary: #ffffff; --secondary-ink: #ff4db2;
  --live: #d4122e; --warn: #f7cd3a; --on-warn: #201a09;
  --g0: #5fa2ee; --g1: #f0a04a; --g2: #b98ae6; --g3: #3fbcc4; --g4: #a5a8b3; --g5: #54c17b;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--primary-darkest, #12121c); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.3; -webkit-font-smoothing: antialiased; }
body { overscroll-behavior: none; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--secondary-ink); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
svg.ic { width: 24px; height: 24px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.press { transition: filter 120ms, background 120ms; }
.press:not(:disabled):active { filter: brightness(1.3); }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
.pill:empty { display: none; }
.pill.live { background: var(--live); color: #fff; }
.pill.warn { background: var(--warn); color: var(--on-warn); }
.note { color: var(--muted); font-size: 0.8125rem; margin: 0; }
.note:empty { display: none; }
.scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; }

/* MaterialButton: 4px radius, contained or outlined */
.mb { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 4px; font-size: 0.9em; font-weight: 500; white-space: nowrap; background: var(--lighter); }
.mb.contained { background: var(--secondary-fill); color: var(--on-secondary); }
.mb.contained:disabled { background: var(--lighter); color: var(--muted); opacity: 1; }
.mb.outlined { background: transparent; border: 1px solid currentColor; color: var(--text); }
.mb.small { padding: 0 14px; }
.mb.hides.on { background: var(--warn); color: var(--on-warn); border-color: transparent; filter: none; }

/* pairing: the Auth panel (FreeShow--Auth.svelte), one field with a lock and a full-width submit */
#pair { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--darkest); }
#pair .panel { width: min(560px, 94vw); display: flex; flex-direction: column; gap: 20px; padding: 24px; border-radius: 18px; background: linear-gradient(160deg, rgb(255 255 255 / 0.06), rgb(255 255 255 / 0.03)); border: 1px solid var(--lighter); }
#pair .brand { display: flex; align-items: center; justify-content: center; gap: 12px; }
#pair .brand .mark { width: 48px; height: 48px; border-radius: 12px; background: var(--secondary); color: #fff; display: grid; place-items: center; }
#pair h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
#pair label { display: block; color: var(--muted); font-size: 0.8125rem; margin-bottom: 6px; }
.fld { position: relative; }
.fld svg.ic { position: absolute; left: 14px; top: 17px; width: 20px; height: 20px; color: var(--muted); }
#pin { width: 100%; height: 56px; border-radius: 8px; border: 1px solid var(--lighter); background: var(--darker); padding: 0 14px 0 44px; font-size: 1.5rem; letter-spacing: 0.4em; font-variant-numeric: tabular-nums; }
#pin:focus { outline: none; border-color: var(--secondary); }
#pin::placeholder { color: var(--faint); opacity: 0.6; }
#pair-error { margin: 0; min-height: 1.3em; color: var(--warn); font-weight: 600; font-size: 0.875rem; }
#pair-btn { width: 100%; min-height: 52px; font-size: 1rem; }
.seg { display: flex; gap: 0; border: 1px solid var(--lighter); border-radius: 4px; overflow: hidden; }
.seg-btn { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 4px 8px; background: var(--darker); color: var(--muted); font-size: 0.9375rem; line-height: 1.15; overflow-wrap: anywhere; }
.seg-btn.on { background: var(--secondary-fill); color: var(--on-secondary); }

#remote { height: 100dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; background: var(--primary); }
/* header: back arrow, a two-line centred title, a search icon */
#head { flex: 0 0 auto; display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; padding: max(4px, env(safe-area-inset-top)) 4px 4px; background: var(--darkest); min-height: 58px; }
#head button { width: 52px; height: 52px; display: grid; place-items: center; color: var(--secondary-ink); }
#head .mid { text-align: center; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
#title { margin: 0; font-size: 1rem; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sub { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; min-height: 20px; }

/* offline: the page's own disconnected token, a bar under the header */
#lost { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; font-size: 0.9375rem; }
#lost small { display: block; font-weight: 400; font-size: 0.8125rem; }

#panes { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.pane { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }

/* slides: sections as outlined 4px chips, then the list or grid */
#sections { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 8px 8px; background: var(--primary); }
#sections::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--gc, var(--muted)); color: var(--gc, var(--text)); font-size: 0.875rem; font-weight: 500; white-space: nowrap; }
.chip.live { background: var(--gc, var(--text)); color: #0b0c10; }
.g0 { --gc: var(--g0); } .g1 { --gc: var(--g1); } .g2 { --gc: var(--g2); } .g3 { --gc: var(--g3); } .g4 { --gc: var(--g4); } .g5 { --gc: var(--g5); }
#list { flex: 1 1 0; display: grid; grid-template-columns: 1fr; gap: 2px; padding: 4px 6px 8px; align-content: start; }
#list.cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
#list.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
/* one column is the verse list of products/53: a big coloured number, large text, the live row ringed on a lighter grey */
.slide { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 10px; text-align: left; padding: 12px 10px; border-radius: 6px; outline: 2px solid transparent; outline-offset: -2px; }
.slide .n { font-size: 1.75rem; font-weight: 700; color: var(--secondary-ink); text-align: center; font-variant-numeric: tabular-nums; }
.slide .words { white-space: pre-wrap; overflow-wrap: anywhere; font-size: clamp(1.15rem, 5vw, 1.4rem); font-weight: 600; line-height: 1.3; }
.slide .tag { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 2px; color: var(--gc, var(--muted)); }
.slide.live { background: var(--raised); outline-color: var(--secondary); }
#list.kept .slide.live .words { opacity: 0.55; }
#list.cols2 .slide, #list.cols3 .slide { grid-template-columns: 1fr; gap: 4px; align-content: start; background: var(--lighter); padding: 8px; min-height: 84px; }
#list.cols2 .slide .n, #list.cols3 .slide .n { text-align: left; font-size: 0.875rem; display: flex; align-items: center; gap: 6px; }
#list.cols2 .slide .words { font-size: 0.875rem; font-weight: 500; }
#list.cols3 .slide .words { font-size: 0.75rem; font-weight: 500; }
#list.cols2 .slide.live, #list.cols3 .slide.live { background: var(--raised); }
#list.cols3 .slide .tag, #list.cols3 .slide .n b { display: none; }

/* the control row, the Clear strip, five icon tabs */
#ctl { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 52px; background: var(--darkest); border-radius: 8px 8px 0 0; }
#ctl button { min-height: 56px; display: grid; place-items: center; color: var(--secondary-ink); }
#ctl button svg.ic { width: 30px; height: 30px; stroke-width: 2.4; }
#ctl #next { color: var(--text); background: var(--secondary-fill); }
#ctl #grid { color: var(--text); }
#clear-row { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 52px; background: var(--darkest); }
#clear { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; background: var(--lighter); color: var(--text); }
#clear.on { background: var(--warn); color: var(--on-warn); }
#more-btn { position: relative; display: grid; place-items: center; color: var(--muted); }
#more-btn.has::after { content: ""; position: absolute; top: 9px; right: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
#more-btn svg.ic { transition: transform 120ms; }
#more-btn[aria-expanded="true"] svg.ic { transform: rotate(180deg); }
#opts { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; background: var(--darkest); }
#opts .mb { padding: 0 6px; min-height: 48px; }
#opts .mb span { overflow-wrap: anywhere; }
#tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 4px 4px max(4px, env(safe-area-inset-bottom)); background: var(--darkest); }
.tab { height: 52px; display: grid; place-items: center; color: var(--secondary-ink); border-radius: 8px; }
.tab svg.ic { width: 28px; height: 28px; }
.tab[aria-selected="true"] { background: var(--lighter); color: #fff; }

/* plan: rows of the project (FreeShow--Project.svelte, FreeShow--ShowButton.svelte) */
#plan-list { flex: 1 1 0; padding: 4px 0; }
.head { padding: 14px 16px 6px; color: var(--muted); font-size: 0.8125rem; font-weight: 600; }
.prow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 16px; text-align: left; background: var(--primary); border-bottom: 1px solid var(--darker); font-size: 1rem; }
.prow svg.ic { color: var(--secondary-ink); }
.prow .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow.live { background: var(--lighter); }
.prow.picked { background: var(--raised); outline: 2px solid var(--secondary); outline-offset: -2px; }
#plan-bar { flex: 0 0 auto; padding: 8px; background: var(--darkest); }

/* search: FreeShow--Shows.svelte, a field over a list */
.sbox { flex: 0 0 auto; padding: 8px; background: var(--primary); }
.field { width: 100%; height: 48px; border-radius: 4px; border: 0; background: var(--darker); padding: 0 14px; font-size: 1rem; }
.field::placeholder { color: var(--faint); opacity: 1; }
.field:focus { outline: 2px solid var(--secondary); }
#search-hint { padding: 4px 16px 8px; }
#hits { flex: 1 1 0; }
.hit { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; min-height: 66px; padding: 6px 8px 6px 16px; background: var(--primary); border-bottom: 1px solid var(--darker); }
.hit > svg.ic { color: var(--secondary-ink); width: 22px; height: 22px; }
.hit .t, .hit .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .d { color: var(--muted); font-size: 0.8125rem; margin-top: 1px; }
.hit .txt { min-width: 0; }

/* screen (the stage page): a big clock, the message */
#pane-stage, #pane-settings { padding: 12px 8px; gap: 12px; }
.card { background: var(--lighter); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 0.9375rem; font-weight: 600; color: var(--muted); }
[data-clock]:empty::before { content: "0:00"; color: var(--faint); }
.clock { text-align: center; font-size: 3.25rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; min-height: 1.1em; }
.clock.run { color: var(--text); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mins { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
#minutes { width: 84px; height: 48px; border-radius: 4px; border: 0; background: var(--darker); text-align: center; font-size: 1.125rem; font-variant-numeric: tabular-nums; }
#msg-hide.on { background: var(--warn); color: var(--on-warn); }
.keys { margin: 0; color: var(--muted); font-size: 0.8125rem; line-height: 1.5; }

@media (max-height: 700px) { #ctl button { min-height: 50px; } #clear { min-height: 44px; } .tab { height: 48px; } .slide { padding: 8px 10px; } }
</style>
</head>

<main id="pair" hidden>
  <div class="panel">
    <div class="brand"><div class="mark" aria-hidden="true"><svg class="ic"><use href="#i-stage"/></svg></div><h1 data-i="pair_title"></h1></div>
    <div><label for="pin" data-i="pin"></label>
      <div class="fld"><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg>
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="0000"></div></div>
    <p id="pair-error" role="alert"></p>
    <button id="pair-btn" class="mb contained press" type="button" data-i="connect"></button>
    <div class="seg" data-lang-switch></div>
  </div>
</main>

<main id="remote" hidden>
  <div id="head">
    <button type="button" id="back" data-keep data-i-aria="back_to_live"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="mid"><h1 id="title"></h1><div id="sub"><span id="count"></span><span class="pill" id="live-state"></span></div></div>
    <button type="button" id="go-search" data-keep data-i-aria="tab_search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
  </div>
  <div id="lost" role="status" hidden><svg class="ic" aria-hidden="true"><use href="#i-lost"/></svg><div><span data-i="lost"></span><small data-i="retrying"></small></div></div>

  <div id="panes">
    <section id="pane-live" class="pane" role="tabpanel">
      <div id="sections" data-i-aria="jump"></div>
      <div id="list" class="scroll"></div>
      <div id="ctl">
        <button class="press" type="button" id="prev" data-act="prev" data-i-aria="back"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg></button>
        <button class="press" type="button" id="next" data-act="next" data-i-aria="next_btn"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
        <button class="press" type="button" id="grid" data-keep data-i-aria="slides_grid"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg></button>
      </div>
      <div id="opts" hidden>
        <button class="mb outlined hides press" type="button" data-toggle="black" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-black"/></svg><span data-i="black"></span></button>
        <button class="mb outlined hides press" type="button" data-toggle="logo" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-logo"/></svg><span data-i="logo"></span></button>
        <button class="mb outlined press" type="button" data-toggle="live" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-live"/></svg><span data-i="live"></span></button>
      </div>
      <div id="clear-row">
        <button id="clear" class="press" type="button" data-toggle="text" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg><span data-i="clear_text"></span></button>
        <button id="more-btn" class="press" type="button" data-keep aria-expanded="false" data-i-aria="output"><svg class="ic" aria-hidden="true"><use href="#i-chev-up"/></svg></button>
      </div>
      <p id="logo-note" class="note" hidden data-i="logo_needs" style="padding:4px 16px;background:var(--darkest)"></p>
    </section>

    <section id="pane-plan" class="pane" role="tabpanel" hidden>
      <div id="plan-list" class="scroll"></div>
      <div id="plan-bar"><button class="mb contained press" style="width:100%" type="button" data-act="plan-show" disabled></button></div>
    </section>

    <section id="pane-search" class="pane" role="tabpanel" hidden>
      <div class="sbox"><input id="search" class="field" type="search" maxlength="100" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" data-i-ph="search_ph" data-i-aria="search_ph"></div>
      <p id="search-hint" class="note"></p>
      <div id="hits" class="scroll"></div>
    </section>

    <section id="pane-stage" class="pane scroll" role="tabpanel" hidden>

          <button id="cd-start" class="mb contained press" type="button" data-i="start"></button>
          <button id="cd-stop" class="mb outlined press" type="button" data-i="stop"></button>

      </section>
      <section class="card">
        <h2 data-i="message"></h2>
        <input id="msg" class="field" maxlength="200" autocomplete="off" data-i-ph="message_ph" data-i-aria="message">
        <div class="two">
          <button id="msg-show" class="mb contained press" type="button" data-i="message_show"></button>
          <button id="msg-hide" class="mb outlined press" type="button" data-i="message_hide"></button>
        </div>
        <p id="msg-state" class="note"></p>
      </section>
    </section>

    <section id="pane-settings" class="pane scroll" role="tabpanel" hidden>
      <section class="card"><h2 data-i="language"></h2><div class="seg" data-lang-switch></div></section>
      <section class="card"><h2 data-i="keys_title"></h2><p class="keys" data-i="keys_text"></p></section>
    </section>
  </div>

  <nav id="tabs" role="tablist">
    <button class="tab press" type="button" role="tab" data-tab="search" data-keep data-i-aria="tab_search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
    <button class="tab press" type="button" role="tab" data-tab="plan" data-keep data-i-aria="tab_plan"><svg class="ic" aria-hidden="true"><use href="#i-doc"/></svg></button>
    <button class="tab press" type="button" role="tab" data-tab="live" data-keep data-i-aria="tab_live"><svg class="ic" aria-hidden="true"><use href="#i-slide"/></svg></button>
    <button class="tab press" type="button" role="tab" data-tab="stage" data-keep data-i-aria="countdown"><svg class="ic" aria-hidden="true"><use href="#i-stage"/></svg></button>
    <button class="tab press" type="button" role="tab" data-tab="settings" data-keep data-i-aria="settings"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </nav>
</main>

<script src="/look/core.js"></script>
<script>
"use strict";
const R = window.Remote, $ = R.$, t = R.t;
let tab = "live", cols = 1;
const NAMES = { plan: "tab_plan", search: "tab_search", stage: "screen", settings: "settings" };

function setTab(name) {
  tab = name;
  for (const n of ["live", "plan", "search", "stage", "settings"]) $("pane-" + n).hidden = n !== name;
  document.querySelectorAll("#tabs .tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  paintTitle();
  if (name === "search") $("search").focus();
}
function paintTitle() {
  const s = R.state;
  $("title").textContent = tab === "live" ? (s ? R.view(s).title : "") : t(NAMES[tab]);
  $("sub").hidden = tab !== "live";
}
document.querySelectorAll("#tabs .tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("back").addEventListener("click", () => setTab(tab === "live" ? "plan" : "live"));
$("go-search").addEventListener("click", () => setTab("search"));
$("grid").addEventListener("click", () => { cols = cols % 3 + 1; $("list").className = "scroll" + (cols > 1 ? " cols" + cols : "") + ($("list").classList.contains("kept") ? " kept" : ""); });
$("more-btn").addEventListener("click", () => {
  const open = $("opts").hidden;
  $("opts").hidden = !open;
  $("more-btn").setAttribute("aria-expanded", String(open));
});

function slide(sl, i, group) {
  const b = R.el("button", "slide press" + (group === null ? "" : R.groupClass(group)));
  b.type = "button";
  const n = R.el("span", "n"); n.append(R.el("b", "", ""), document.createTextNode(String(i + 1)));
  const words = R.el("span", "words");
  if (sl.label) words.append(R.el("span", "tag", R.nice(sl.label)));
  words.append(document.createTextNode(sl.text));
  b.append(n, words);
  return b;
}
function chip(x) {
  const b = R.el("button", "chip press" + R.groupClass(x.group), R.nice(x.label) || x.short);
  b.type = "button"; b.setAttribute("aria-label", R.nice(x.label));
  return b;
}

R.hooks.render = (s, v) => {
  paintTitle();
  $("count").textContent = v.count;
  /* red while the room sees the slide; yellow with the reason while something keeps it away */
  const st = $("live-state");
  st.className = "pill" + (v.onair ? " live" : (v.why ? " warn" : ""));
  st.textContent = v.onair ? t("live") : v.why;
  R.fillSections($("sections"), chip);
  R.fillSlides($("list"), slide);
  $("list").classList.toggle("kept", v.kept);
  $("more-btn").classList.toggle("has", s.black || s.logo || s.off);
  R.fillPlan($("plan-list"), (p) => R.el("div", "head", p.title), (p) => {
    const b = R.el("button", "prow press");
    b.type = "button";
    b.append(R.icon(R.kindIcon(p.kind)), R.el("span", "t", p.title), R.el("span", "pill live", p.live ? t("plan_live") : ""));
    return b;
  });
};
R.hooks.hits = () => R.fillHits($("hits"), (h) => {
  const row = R.el("div", "hit");
  const txt = R.el("div", "txt"); txt.append(R.el("div", "t", h.title), R.el("div", "d", h.detail));
  const [show, add] = R.hitButtons(h, "mb contained small", "mb outlined small");
  row.append(R.icon(R.kindIcon(h.kind)), txt, show, add);
  return row;
});
R.hooks.lang = () => paintTitle();
R.hooks.clock = (left) => $("pane-stage").querySelector(".clock").classList.toggle("run", left !== null);
R.hooks.openLive = () => setTab("live");
R.hooks.openSearch = () => setTab("search");
R.hooks.start = () => setTab(tab);
R.boot();
</script>
</body>
</html>
