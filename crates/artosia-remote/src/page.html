<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090c">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#dbdee3">
<title>Artosia remote</title>
<style>
/* The operator window's own tokens (crates/artosia/src/theme.rs): surfaces that differ by tone,
   red for what is on the projector and nothing else, yellow for hidden or a warning. The hex
   values are for phones that know no oklch; the same tones in oklch follow. */
:root {
  --chrome: #08090c;
  --side: #0f1216;
  --work: #1c1e23;
  --raised: #282b31;
  --edge: #3a3d44;
  --text: #eff0f3;
  --muted: #adb1b9;
  --faint: #888c94;
  --accent: #5599f3;
  --on-accent: #07101c;
  --live: #c50220;
  --on-live: #ffffff;
  --warn: #f7cd3a;
  --on-warn: #201a09;
  --warn-ink: #f7cd3a;
  --primary: var(--text);
  --on-primary: var(--side);
  /* section colours, the same families as the operator window */
  --g0: #5fa2ee;
  --g1: #f0a04a;
  --g2: #b98ae6;
  --g3: #3fbcc4;
  --g4: #a5a8b3;
  --g5: #54c17b;
  --tint: 16%;
  --tint-strong: 30%;
  --ink-mix: white 45%;
  --gap: 10px;
  --pad: 14px;
  --radius: 12px;
  --radius-sm: 8px;
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-title: 1.0625rem;
  --fs-small: 0.8125rem;
  --fs-body: 1rem;
  --fs-row: 0.9375rem;
  --fs-tile: 0.78rem;
  --fs-live: clamp(1.35rem, 6vw, 2rem);
  --fs-next: clamp(0.95rem, 4vw, 1.2rem);
  --fs-clock: 1.6rem;
  --btn-h: 48px;
  --dock-h: 68px;
  --row-h: 48px;
  --slide-h: 44px;
  --hit-h: 62px;
  --tab-h: 54px;
  --tile-h: 62px;
  --chip-h: 34px;
  --dim-opacity: 0.4;
}
@supports (color: oklch(0.7 0.1 100)) {
  :root {
    --chrome: oklch(0.14 0.008 265);
    --side: oklch(0.18 0.01 265);
    --work: oklch(0.235 0.01 265);
    --raised: oklch(0.29 0.012 265);
    --edge: oklch(0.36 0.012 265);
    --text: oklch(0.955 0.004 265);
    --muted: oklch(0.76 0.012 265);
    --faint: oklch(0.64 0.012 265);
    --accent: oklch(0.68 0.15 256);
    --on-accent: oklch(0.17 0.03 256);
    --live: oklch(0.52 0.21 25);
    --warn: oklch(0.86 0.16 92);
    --on-warn: oklch(0.22 0.03 92);
    --warn-ink: oklch(0.86 0.16 92);
    --g0: oklch(0.72 0.13 250);
    --g1: oklch(0.78 0.15 62);
    --g2: oklch(0.72 0.15 305);
    --g3: oklch(0.76 0.11 195);
    --g4: oklch(0.74 0.012 265);
    --g5: oklch(0.76 0.14 152);
  }
}
@media (prefers-color-scheme: light) {
  :root {
    --chrome: #dbdee3;
    --side: #e9ebf0;
    --work: #fbfcfd;
    --raised: #e0e3e8;
    --edge: #c1c4cb;
    --text: #16181e;
    --muted: #44484f;
    --faint: #545860;
    --accent: #005fc6;
    --on-accent: #ffffff;
    --live: #be0019;
    --warn-ink: #815200;
    --tint: 20%;
    --tint-strong: 36%;
    --ink-mix: black 70%;
  }
  @supports (color: oklch(0.7 0.1 100)) {
    :root {
      --chrome: oklch(0.9 0.008 265);
      --side: oklch(0.94 0.007 265);
      --work: oklch(0.99 0.002 265);
      --raised: oklch(0.915 0.008 265);
      --edge: oklch(0.82 0.01 265);
      --text: oklch(0.21 0.012 265);
      --muted: oklch(0.4 0.014 265);
      --faint: oklch(0.46 0.014 265);
      --accent: oklch(0.5 0.18 256);
      --live: oklch(0.5 0.21 25);
      --warn-ink: oklch(0.48 0.11 75);
    }
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--side); color: var(--text); font-family: var(--font); font-size: var(--fs-body); line-height: 1.3; -webkit-font-smoothing: antialiased; }
body { overscroll-behavior: none; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
svg.ic { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* A pressed control moves a hair; a hover lifts its tone on a device that has one. */
.press { transition: transform 80ms, filter 80ms, background-color 80ms; }
.press:not(:disabled):active { transform: scale(0.98); filter: brightness(0.9); }
@media (hover: hover) { .press:not(:disabled):hover { filter: brightness(1.12); } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--raised); color: var(--text); border: 1px solid var(--edge); border-radius: var(--radius-sm); min-height: var(--btn-h); padding: 0 var(--pad); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.btn > span { overflow: hidden; text-overflow: ellipsis; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
/* A main button that cannot be pressed yet steps back among the others, and stays readable. */
.btn.primary:disabled { background: var(--raised); color: var(--muted); border-color: var(--edge); opacity: 1; }
.btn.hides.on { background: var(--warn); color: var(--on-warn); border-color: transparent; }
.btn.small { min-height: 44px; padding: 0 12px; font-size: var(--fs-row); }
.btn.ghost { background: transparent; }

.field { background: var(--work); border: 1px solid var(--edge); border-radius: var(--radius-sm); height: var(--btn-h); padding: 0 var(--pad); width: 100%; min-width: 0; }
.field::placeholder { color: var(--faint); opacity: 1; }
.field:focus { border-color: var(--accent); outline: none; }
.note { color: var(--muted); font-size: var(--fs-small); margin: 0; overflow-wrap: anywhere; }
.note:empty { display: none; }

/* A choice between a few: one filled segment, as the operator's. */
.seg { display: flex; gap: 2px; padding: 3px; background: var(--raised); border: 1px solid var(--edge); border-radius: var(--radius-sm); }
/* A long name takes two lines; it is never cut. */
.seg-btn { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 4px 8px; border-radius: 6px; color: var(--muted); font-weight: 600; font-size: var(--fs-row); line-height: 1.15; overflow-wrap: anywhere; }
.seg-btn.on { background: var(--work); color: var(--text); box-shadow: 0 0 0 1px var(--edge); }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-small); font-weight: 600; white-space: nowrap; }
.pill.live { background: var(--live); color: var(--on-live); }
.pill.warn { background: var(--warn); color: var(--on-warn); }
.pill:empty { display: none; }

/* pairing */
#pair { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px; max-width: 400px; margin: 0 auto; }
#pair .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--work); border: 1px solid var(--edge); display: grid; place-items: center; color: var(--text); margin-bottom: 4px; }
#pair .mark svg.ic { width: 24px; height: 24px; }
#pair h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
#pair label { color: var(--muted); font-size: var(--fs-small); font-weight: 600; }
#pin { background: var(--work); border: 1px solid var(--edge); border-radius: var(--radius); height: 68px; font-size: 2rem; font-weight: 600; letter-spacing: 0.4em; text-indent: 0.4em; text-align: center; width: 100%; font-variant-numeric: tabular-nums; }
#pin::placeholder { color: var(--faint); opacity: 0.6; }
#pin:focus { border-color: var(--accent); outline: none; }
#pair-error { color: var(--warn-ink); min-height: 1.4em; margin: 0; font-size: var(--fs-small); font-weight: 600; }
#pair .btn { min-height: 54px; font-size: 1.05rem; }
#pair .seg { margin-top: 8px; }

/* remote */
#remote { height: 100dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; background: var(--side); }
#head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: max(8px, env(safe-area-inset-top)) 16px 8px; background: var(--chrome); border-bottom: 1px solid var(--edge); }
#title { margin: 0; font-size: var(--fs-title); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#head-right { display: flex; gap: 8px; align-items: center; white-space: nowrap; color: var(--muted); font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
#clock-pill { font-variant-numeric: tabular-nums; }

#lost { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; background: var(--warn); color: var(--on-warn); padding: 8px 16px; font-weight: 600; font-size: var(--fs-row); }
#lost small { display: block; font-weight: 400; font-size: var(--fs-small); }

#panes { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: 12px 12px 0; }
.pane { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
.scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; }

.card { background: var(--work); border: 1px solid var(--edge); border-radius: var(--radius); padding: 12px var(--pad); }
.card .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.card-head { display: flex; align-items: center; gap: 8px; min-height: 22px; margin-bottom: 6px; }
.card-head .tag { color: var(--muted); font-size: var(--fs-small); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card-head .tag:empty { display: none; }
.card-head .end { margin-left: auto; }

/* What the room sees. Its frame is red while the room sees it, all the way round. */
#live { flex: 0 1 auto; max-height: 28vh; overflow-y: auto; min-height: 84px; }
#live.onair { border-color: var(--live); box-shadow: 0 0 0 1px var(--live); }
#live .body { font-size: var(--fs-live); line-height: 1.22; font-weight: 600; letter-spacing: -0.01em; transition: opacity 120ms; }
#live.dim .body { opacity: var(--dim-opacity); }
#next { flex: 0 0 auto; padding: 8px var(--pad) 10px; background: transparent; }
#next .card-head { margin-bottom: 2px; }
#next .body { font-size: var(--fs-next); line-height: 1.25; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* A section is named in full on its chip, in its own colour, as in the window. One row that
   slides sideways when a song has many. */
#sections { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
#sections::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; height: var(--chip-h); padding: 0 12px; border-radius: 999px; background: var(--raised); color: var(--gc, var(--text)); font-weight: 600; font-size: var(--fs-small); white-space: nowrap; }
.chip.live { background: var(--gc, var(--primary)); color: #0b0c0f; }
.tagchip { display: inline-block; max-width: 100%; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--gc, var(--muted)); font-size: 0.75rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.g0 { --gc: var(--g0); } .g1 { --gc: var(--g1); } .g2 { --gc: var(--g2); }
.g3 { --gc: var(--g3); } .g4 { --gc: var(--g4); } .g5 { --gc: var(--g5); }
@supports (color: color-mix(in srgb, red 50%, blue)) {
  .chip, .tagchip { background: color-mix(in srgb, var(--gc, var(--muted)) var(--tint), transparent); color: color-mix(in srgb, var(--gc, var(--muted)), var(--ink-mix)); }
  .chip.live { background: var(--gc, var(--primary)); color: #0b0c0f; }
}

/* Four equal tiles with an icon each, lit while what they name is true: yellow hides
   something from the room, red is the room seeing the Live list. */
#toggles { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; height: var(--tile-h); padding: 4px; border-radius: var(--radius-sm); background: var(--work); border: 1px solid var(--edge); color: var(--text); font-size: var(--fs-tile); font-weight: 600; line-height: 1.1; text-align: center; }
.tile span { overflow-wrap: anywhere; max-width: 100%; }
.tile.hides.on { background: var(--warn); color: var(--on-warn); border-color: transparent; }
.tile.onair.on { background: var(--live); color: var(--on-live); border-color: transparent; }

/* The slides as the window lists them: a number, the section, the first words. */
#list { flex: 1 1 0; min-height: 56px; display: flex; flex-direction: column; background: var(--work); border: 1px solid var(--edge); border-radius: var(--radius); }
#list:empty { display: none; }
.slide { display: grid; grid-template-columns: 1.6rem minmax(0, 5.6rem) minmax(0, 1fr); align-items: center; gap: 8px; text-align: left; padding: 0 12px 0 8px; width: 100%; height: var(--slide-h); flex: 0 0 auto; border-bottom: 1px solid var(--edge); color: var(--text); }
.slide:last-child { border-bottom: 0; }
.slide .n { color: var(--faint); font-size: var(--fs-small); font-variant-numeric: tabular-nums; text-align: right; }
.slide .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-row); }
.slide.live { background: var(--live); color: var(--on-live); }
.slide.live .n { color: var(--on-live); opacity: 0.8; }
.slide.live .tagchip { background: rgba(255, 255, 255, 0.2); color: var(--on-live); }
.kept .slide.live { background: var(--warn); color: var(--on-warn); }
.kept .slide.live .n { color: var(--on-warn); }
.kept .slide.live .tagchip { background: rgba(0, 0, 0, 0.14); color: var(--on-warn); }
.slide:first-child { border-radius: 11px 11px 0 0; }
.slide:last-child { border-radius: 0 0 11px 11px; }
.slide:only-child { border-radius: 11px; }

/* plan */
#plan-list { flex: 1 1 0; display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.row { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; height: var(--row-h); flex: 0 0 auto; padding: 0 12px; border-radius: var(--radius-sm); background: var(--work); border: 1px solid var(--edge); color: var(--text); }
.row svg.ic { color: var(--faint); }
.row .t { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: var(--fs-row); font-weight: 500; }
.row.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.row.picked svg.ic { color: var(--accent); }
@supports (color: color-mix(in srgb, red 50%, blue)) { .row.picked { background: color-mix(in srgb, var(--accent) 14%, var(--work)); } }
/* A heading of the plan reads as a heading: its words, then a hairline to the edge. */
.divider { flex: 0 0 auto; height: 34px; display: flex; align-items: flex-end; gap: 10px; padding: 0 4px 6px; color: var(--muted); font-size: var(--fs-small); font-weight: 600; }
.divider span { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.divider::after { content: ""; flex: 1 1 24px; height: 1px; background: var(--edge); margin-bottom: 0.5em; }
#plan-show { flex: 0 0 auto; min-height: 52px; }

/* search */
.search-box { position: relative; flex: 0 0 auto; }
.search-box svg.ic { position: absolute; left: 14px; top: 50%; margin-top: -10px; color: var(--faint); pointer-events: none; }
.search-box .field { padding-left: 44px; }
#search-hint { padding: 6px 4px; }
#hits { flex: 1 1 0; display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.hit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; min-height: var(--hit-h); flex: 0 0 auto; padding: 8px 8px 8px 12px; background: var(--work); border: 1px solid var(--edge); border-radius: var(--radius-sm); }
.hit > svg.ic { color: var(--faint); }
.hit .txt { min-width: 0; }
.hit .t, .hit .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .t { font-weight: 600; font-size: var(--fs-row); }
.hit .d { color: var(--muted); font-size: var(--fs-small); margin-top: 2px; }

/* more */
#pane-more { gap: var(--gap); padding-bottom: 8px; }
.card h2 { margin: 0 0 10px; font-size: var(--fs-row); font-weight: 600; }
.card .line { display: flex; gap: var(--gap); align-items: center; }
.card .line > .btn { flex: 1 1 0; }
.card .line + .line, .card .line + .note, .card .note + .line, .card .field + .line { margin-top: 10px; }
#clock-left { font-size: var(--fs-clock); font-weight: 600; font-variant-numeric: tabular-nums; flex: 1 1 auto; }
#minutes { width: 84px; flex: 0 0 auto; text-align: center; font-variant-numeric: tabular-nums; }
#keys-card { display: none; }
@media (hover: hover) and (pointer: fine) { #keys-card { display: block; } }
#keys-text { margin: 0; color: var(--muted); font-size: var(--fs-small); line-height: 1.5; }

/* The two bars at the thumb: back and next, then where to go. */
#bar { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: var(--gap); padding: 10px 12px; }
#bar .btn { min-height: var(--dock-h); border-radius: var(--radius); font-size: 1rem; padding: 0 10px; }
#bar #next-btn { font-size: 1.25rem; }
#next-btn svg.ic, #prev-btn svg.ic { width: 22px; height: 22px; }
#tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 8px max(6px, env(safe-area-inset-bottom)); background: var(--chrome); border-top: 1px solid var(--edge); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--tab-h); border-radius: var(--radius-sm); color: var(--muted); font-size: 0.72rem; font-weight: 600; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.tab[aria-selected="true"] { background: var(--raised); color: var(--text); }

/* A short phone: what the room sees stays whole, so what comes next gives way to the list,
   which shows it too, and the tiles and bars sit lower. */
@media (max-height: 700px) {
  :root { --fs-live: clamp(1.15rem, 5.4vw, 1.5rem); --tile-h: 60px; --dock-h: 58px; --tab-h: 50px; }
  .tile { gap: 3px; }
  .tile svg.ic { width: 18px; height: 18px; }
  #next { display: none; }
  #live { max-height: 36vh; }
}
</style>
</head>

  <symbol id="i-plan" viewBox="0 0 24 24"><path d="M9 7h10M9 12h10M9 17h10M5 7h.01M5 12h.01M5 17h.01"/></symbol>

  <symbol id="i-more" viewBox="0 0 24 24"><path d="M4 8h8M18 8h2M4 16h2M12 16h8"/><circle cx="15" cy="8" r="2.5"/><circle cx="9" cy="16" r="2.5"/></symbol>
  <symbol id="i-song" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.8" cy="17.5" r="2.2"/><circle cx="16.8" cy="15.5" r="2.2"/></symbol>
  <symbol id="i-passage" viewBox="0 0 24 24"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v13H6.5A1.5 1.5 0 0 0 5 18.5zM5 18.5A1.5 1.5 0 0 0 6.5 20H19"/></symbol>
  <symbol id="i-announcements" viewBox="0 0 24 24"><path d="M4 10v4h3l7 4V6l-7 4zM17.5 9.5a4 4 0 0 1 0 5"/></symbol>

<script>
"use strict";

/* Every word the page shows, in one table. Indonesian is written for a volunteer at the
   console, not translated from the English: "Reff" for the chorus, "Tayangkan" for show. */
const STR = {
  en: {
    pair_title: "Artosia remote", pin: "PIN", connect: "Connect",
    wrong_pin: "Wrong PIN", too_many: "Too many tries. Wait a minute.", unreachable: "Cannot reach the computer",
    tab_live: "Live", tab_plan: "Plan", tab_search: "Search", tab_more: "More",
    live: "Live", next: "Next", next_item: "Next item", next_btn: "Next", back: "Back",
    nothing_open: "Nothing open", nothing_live: "Nothing live",
    n_of: "{0} of {1}", n_slides: "{0} slides",
    clear_text: "Clear text", black: "Black", logo: "Logo",
    logo_needs: "Set a logo picture in Artosia first",
    text_cleared: "Text is cleared", screen_black: "Screen is black", logo_showing: "Logo is showing",
    projector_off: "Projector is off",
    jump: "Jump to a section",
    plan_pick: "Pick an item", plan_show: "Show {0}", plan_live: "Live", plan_empty: "The plan is empty",
    search_ph: "Search songs and verses", search_hint: "Type a title, a line or a verse like John 3 16",
    searching: "Searching", no_results: "No results",
    show: "Show", add: "Add", added: "Added", show_aria: "Show {0} now", add_aria: "Add {0} to the plan",
    message: "Message to the room", message_ph: "Write a message", message_show: "Show", message_hide: "Hide",
    message_showing: "Showing: {0}",
    countdown: "Countdown", minutes: "Minutes", start: "Start", stop: "Stop",
    language: "Language",
    keys_title: "Keys",
    keys_text: "Space or the down arrow: next. Up arrow: back. / : search. C: chorus. V: next verse. B: bridge. 1 to 9: that section. F1 no text, F2 black, F3 logo, F6 projector.",
    lost: "Lost connection", retrying: "Trying again"
  },
  id: {
    pair_title: "Remote Artosia",
    pin: "PIN",
    connect: "Sambungkan",
    wrong_pin: "PIN salah",
    too_many: "Terlalu banyak percobaan. Tunggu semenit.",
    unreachable: "Komputer tidak bisa dihubungi",
    tab_live: "Live",
    tab_plan: "Rundown",
    tab_search: "Cari",
    tab_more: "Lainnya",
    live: "Live",
    next: "Berikutnya",
    next_item: "Item berikut",
    next_btn: "Maju",
    back: "Mundur",
    nothing_open: "Belum ada yang dibuka",
    nothing_live: "Belum ada yang tayang",
    n_of: "{0} dari {1}",
    n_slides: "{0} slide",
    clear_text: "Tanpa teks",
    black: "Hitam",
    logo: "Logo",
    logo_needs: "Pilih logo dulu lewat Tema di komputer",
    text_cleared: "Teks disembunyikan",
    screen_black: "Layar hitam",
    logo_showing: "Logo sedang tayang",
    projector_off: "Proyektor mati",
    jump: "Loncat ke bagian lagu",
    plan_pick: "Pilih item dulu",
    plan_show: "Tayangkan {0}",
    plan_live: "Live",
    plan_empty: "Rundown masih kosong",
    search_ph: "Cari lagu atau ayat",
    search_hint: "Judul lagu, sebaris lirik, atau ayat, contoh Mazmur 23 1",
    searching: "Mencari",
    no_results: "Tidak ditemukan",
    show: "Tayangkan",
    add: "Tambah",
    added: "Ditambah",
    show_aria: "Tayangkan {0} sekarang",
    add_aria: "Tambah {0} ke rundown",
    message: "Pesan ke jemaat",
    message_ph: "Tulis pesan di sini",
    message_show: "Tayangkan",
    message_hide: "Sembunyikan",
    message_showing: "Sedang tayang: “{0}”",
    countdown: "Hitung mundur",
    minutes: "menit",
    start: "Mulai",
    stop: "Hentikan",
    language: "Bahasa",
    keys_title: "Pintasan",
    keys_text: "Space atau panah bawah maju, panah atas mundur. Tombol / membuka pencarian. R ke reff, B ke bridge. Angka 1 sampai 9 ke bagian itu. F1 sembunyikan teks, F2 hitam, F3 logo, F6 nyalakan atau matikan proyektor",
    lost: "Terputus dari komputer",
    retrying: "Mencoba tersambung lagi"
  }
};
/* Names the operator sends in English, shown in the volunteer's own words. */
const LABELS_ID = [
  [/^Verse (\d+)$/i, "Bait $1"], [/^Chorus$/i, "Reff"], [/^Pre-?chorus$/i, "Pra-reff"],
  [/^Bridge( \d+)?$/i, "Bridge$1"], [/^Intro$/i, "Intro"], [/^(Ending|Outro)$/i, "Penutup"]
];
/* The languages by code. A language outside this file is added by the server below, from its table. */
const LABELS = { id: LABELS_ID };
const LANGS = [["en", "English"], ["id", "Bahasa Indonesia"]];
function addLanguage(code, name, table) {
  LANGS.push([code, name]);
  STR[code] = table;
  if (Array.isArray(table.labels)) LABELS[code] = table.labels.map(([pattern, to]) => [new RegExp(pattern, "i"), to]);
}
/*EXTRA_LANGUAGES*/

const KEY = "artosia-remote-token";
const LANG_KEY = "artosia-remote-lang";
const $ = (id) => document.getElementById(id);
let token = null;
let version = 0;
let state = null;
let lost = false;
let polling = false;
let lang = "en";
let tab = "live";
let picked = null;
let clockOffset = 0;
let searchTimer = null;
let sentSearch = "";
let msgDirty = false;

function store(name, get, value) {
  try {
    if (get) return localStorage.getItem(name);
    if (value) localStorage.setItem(name, value); else localStorage.removeItem(name);
  } catch (e) { /* storage blocked: the choice lasts for this page only */ }
  return null;
}

function t(key, ...args) {
  let s = (STR[lang] && STR[lang][key]) || STR.en[key] || key;
  args.forEach((a, i) => { s = s.replace("{" + i + "}", a); });
  return s;
}
function nice(label) {
  const rules = LABELS[lang];
  if (!rules || !label) return label;
  for (const [re, to] of rules) if (re.test(label)) return label.replace(re, to).trim();
  return label;
}

function pickLang() {
  const saved = store(LANG_KEY, true);
  const known = (code) => LANGS.some(([c]) => c === code);
  if (known(saved)) return saved;
  let base = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().split("-")[0];
  if (base === "in") base = "id";
  return known(base) ? base : "en";
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-i-ph]").forEach((el) => { el.placeholder = t(el.dataset.iPh); });
  document.querySelectorAll("[data-i-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.iAria)); });
  document.querySelectorAll("[data-lang-switch]").forEach((box) => {
    box.replaceChildren();
    for (const [code, name] of LANGS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "seg-btn press" + (lang === code ? " on" : "");
      b.textContent = name; b.dataset.keep = "";
      b.setAttribute("aria-pressed", String(lang === code));
      b.addEventListener("click", () => setLang(code));
      box.append(b);
    }
  });
  document.querySelectorAll("#tabs .tab").forEach((b) => b.setAttribute("aria-label", t("tab_" + b.dataset.tab)));
  resetRenderCache();
  if (state) render();
  refreshPlanShow();
  refreshSearchHint();
  tickClock();
}
function setLang(code) {
  lang = code;
  store(LANG_KEY, false, code);
  applyLang();
}

function show(which) {
  $("pair").hidden = which !== "pair";
  $("remote").hidden = which !== "remote";
  if (which !== "remote") setLost(false);
}

function setTab(name) {
  tab = name;
  for (const n of ["live", "plan", "search", "more"]) $("pane-" + n).hidden = n !== name;
  document.querySelectorAll("#tabs .tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
}

function setLost(v) {
  lost = v;
  $("lost").hidden = !v;
  document.querySelectorAll("#remote button:not([data-keep])").forEach((b) => {
    if (v) { b.dataset.wasDisabled = b.disabled ? "1" : ""; b.disabled = true; }
    else if (b.dataset.wasDisabled !== undefined) { b.disabled = b.dataset.wasDisabled === "1"; delete b.dataset.wasDisabled; }
  });
  $("search").disabled = v;
  $("msg").disabled = v;
  $("minutes").disabled = v;
  if (!v && state) render();
}

/* wake lock: only exists in secure contexts, so plain http on a LAN usually has none */
let wake = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible" && !wake) {
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    }
  } catch (e) { wake = null; }
}
document.addEventListener("visibilitychange", () => { if (token) keepAwake(); });

async function pair(pin) {
  $("pair-error").textContent = "";
  try {
    const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
    if (r.ok) {
      token = (await r.json()).token;
      store(KEY, false, token);
      start();
      return;
    }
    $("pair-error").textContent = r.status === 429 ? t("too_many") : t("wrong_pin");
  } catch (e) {
    $("pair-error").textContent = t("unreachable");
  }
  show("pair");
}

function start() {
  show("remote");
  setTab(tab);
  keepAwake();
  if (!polling) { polling = true; poll(); }
}

function unpair() {
  token = null; version = 0; state = null;
  store(KEY, false, null);
  $("pin").value = "";
  show("pair");
}

async function poll() {
  while (token) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const r = await fetch("/api/state?since=" + version, { headers: { Authorization: "Bearer " + token }, signal: ctl.signal, cache: "no-store" });
      if (r.status === 401) { unpair(); break; }
      if (!r.ok) throw new Error("status " + r.status);
      const s = await r.json();
      if (lost) setLost(false);
      if (s.version !== version) {
        version = s.version; state = s;
        if (typeof s.now === "number") clockOffset = s.now - Date.now() / 1000;
        render();
      }
    } catch (e) {
      setLost(true);
      await new Promise((res) => setTimeout(res, 1500));
    } finally {
      clearTimeout(timer);
    }
  }
  polling = false;
}

async function send(cmd, quiet) {
  if (!token || lost) return;
  if (!quiet && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { /* ignore */ } }
  try {
    const r = await fetch("/api/command", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(cmd) });
    if (r.status === 401) unpair();
    else if (!r.ok && r.status !== 400) setLost(true);
  } catch (e) {
    setLost(true);
  }
}

/* ---------- rendering ---------- */

const cache = {};
function resetRenderCache() { for (const k of Object.keys(cache)) delete cache[k]; }
function changed(key, value) {
  const sig = JSON.stringify(value);
  if (cache[key] === sig) return false;
  cache[key] = sig;
  return true;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function icon(name) {
  /* The namespace is read off the page's own drawing: the page names no address at all. */
  const ns = document.querySelector("svg").namespaceURI;
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "ic");
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS(ns, "use");
  use.setAttribute("href", "#i-" + name);
  svg.append(use);
  return svg;
}
function groupClass(group) { return " g" + Math.min(Math.max(group | 0, 0), 5); }

function liveSection(s) {
  let at = -1;
  if (s.live === null) return at;
  s.sections.forEach((x, i) => { if (x.slide <= s.live) at = i; });
  return at;
}

function render() {
  const s = state;
  $("title").textContent = s.title || t("nothing_open");
  const n = s.slides.length;
  const live = s.live;
  $("count").textContent = n && live !== null ? t("n_of", live + 1, n) : (n ? t("n_slides", n) : "");

  const cur = live !== null ? s.slides[live] : null;
  /* Red while the room sees these words; a yellow word for what keeps them from it. */
  const kept = !cur || s.off || s.hidden || s.black || s.logo;
  $("live-tag").textContent = cur && cur.label ? nice(cur.label) : "";
  $("live-text").textContent = cur ? cur.text : t("nothing_live");
  $("live").classList.toggle("dim", kept);
  $("live").classList.toggle("onair", !kept);
  $("live-pill").hidden = kept;
  /* As in the window: the live slide is yellow, never red, while the room does not see it. */
  $("list").classList.toggle("kept", kept);
  $("live-state").textContent = s.off ? t("projector_off") : (s.logo ? t("logo_showing") : (s.black ? t("screen_black") : (s.hidden ? t("text_cleared") : "")));

  const nextIdx = live !== null ? live + 1 : (n ? 0 : -1);
  const nx = nextIdx >= 0 && nextIdx < n ? s.slides[nextIdx] : null;
  $("next").hidden = !nx && !s.next_title;
  if (nx) { $("next-tag").textContent = nx.label ? nice(nx.label) : t("next"); $("next-text").textContent = nx.text; }
  else { $("next-tag").textContent = t("next_item"); $("next-text").textContent = s.next_title; }

  renderSections(s);
  renderSlides(s, live);
  renderToggles(s);
  renderPlan(s);
  renderHits(s);
  renderMessage(s);
  tickClock();
  if (lost) setLost(true);
}

function renderSections(s) {
  const box = $("sections");
  box.hidden = !s.sections.length;
  if (changed("sections", [s.sections, lang])) {
    box.replaceChildren();
    s.sections.forEach((x) => {
      const b = el("button", "chip press" + groupClass(x.group), nice(x.label) || x.short);
      b.type = "button";
      b.setAttribute("aria-label", nice(x.label));
      b.addEventListener("click", () => send({ cmd: "goto", index: x.slide }));
      box.append(b);
    });
  }
  const at = liveSection(s);
  [...box.children].forEach((b, i) => {
    b.classList.toggle("live", i === at);
    if (i === at) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
  /* The chip of the part being sung stays in view when the row is longer than the phone. */
  const liveChip = box.children[at];
  if (liveChip && changed("liveChip", [at, s.sections.length]) && box.scrollWidth > box.clientWidth) {
    box.scrollTo({ left: liveChip.offsetLeft - (box.clientWidth - liveChip.offsetWidth) / 2, behavior: "smooth" });
  }
}

function renderSlides(s, live) {
  const list = $("list");
  if (changed("slides", [s.slides, s.sections, lang])) {
    list.replaceChildren();
    s.slides.forEach((sl, i) => {
      const b = el("button", "slide press");
      b.type = "button";
      /* A number, the section in its own colour, the words: the row the window draws. */
      let group = null;
      s.sections.forEach((x) => { if (x.slide <= i) group = x.group; });
      const tag = el("span", "l");
      if (sl.label) tag.append(el("span", "tagchip" + (group === null ? "" : groupClass(group)), nice(sl.label)));
      b.append(el("span", "n", String(i + 1)), tag, el("span", "t", sl.text));
      b.addEventListener("click", () => send({ cmd: "goto", index: i }));
      list.append(b);
    });
  }
  let liveEl = null;
  [...list.children].forEach((e, i) => {
    const isLive = i === live;
    e.classList.toggle("live", isLive);
    if (isLive) { e.setAttribute("aria-current", "true"); liveEl = e; } else e.removeAttribute("aria-current");
  });
  if (liveEl && changed("liveIdx", live)) liveEl.scrollIntoView({ block: "nearest" });
}

function renderToggles(s) {
  const set = (id, on) => { $(id).classList.toggle("on", on); $(id).setAttribute("aria-pressed", String(on)); };
  set("text-btn", s.hidden);
  set("black-btn", s.black);
  set("live-btn", !s.off);
  set("logo-btn", s.logo);
  $("logo-btn").disabled = !s.logo_ready || lost;
  $("logo-note").hidden = s.logo_ready;
}

function renderPlan(s) {
  if (picked !== null && !s.plan.some((p) => p.id === picked && p.kind !== "heading")) picked = null;
  const list = $("plan-list");
  if (changed("plan", [s.plan, lang])) {
    list.replaceChildren();
    if (!s.plan.length) list.append(el("p", "note", t("plan_empty")));
    s.plan.forEach((p) => {
      if (p.kind === "heading") {
        const d = el("div", "divider");
        d.append(el("span", "", p.title));
        list.append(d);
        return;
      }
      const b = el("button", "row press");
      b.type = "button"; b.dataset.id = p.id;
      const kind = ["song", "passage", "announcements"].includes(p.kind) ? p.kind : "item";
      b.append(icon(kind), el("span", "t", p.title), el("span", "pill live", p.live ? t("plan_live") : ""));
      b.addEventListener("click", () => { picked = picked === p.id ? null : p.id; markPicked(); refreshPlanShow(); });
      list.append(b);
    });
  }
  const liveId = (s.plan.find((p) => p.live) || {}).id;
  [...list.querySelectorAll(".row")].forEach((b) => {
    const isLive = String(liveId) === b.dataset.id;
    b.classList.toggle("live", isLive);
    if (isLive) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
  markPicked();
  refreshPlanShow();
}
function markPicked() {
  document.querySelectorAll("#plan-list .row").forEach((b) => {
    const on = String(picked) === b.dataset.id;
    b.classList.toggle("picked", on);
    b.setAttribute("aria-pressed", String(on));
  });
}
function refreshPlanShow() {
  const b = $("plan-show");
  const p = state && picked !== null ? state.plan.find((x) => x.id === picked) : null;
  b.textContent = p ? t("plan_show", p.title) : t("plan_pick");
  b.disabled = !p || lost;
}

function typedSearch() { return $("search").value.trim(); }
function resultsReady(s) { return typedSearch() !== "" && s && s.hits_for.trim().toLowerCase() === typedSearch().toLowerCase(); }

function renderHits(s) {
  const list = $("hits");
  const ready = resultsReady(s);
  if (changed("hits", [ready ? s.hits : [], ready, lang])) {
    list.replaceChildren();
    if (ready) s.hits.forEach((h) => {
      const row = el("div", "hit");
      const txt = el("div", "txt");
      txt.append(el("div", "t", h.title), el("div", "d", h.detail));
      const show = el("button", "btn small primary press", t("show"));
      show.type = "button"; show.setAttribute("aria-label", t("show_aria", h.title));
      show.addEventListener("click", () => { send({ cmd: "hit", id: h.id }); setTab("live"); });
      const add = el("button", "btn small press", t("add"));
      add.type = "button"; add.setAttribute("aria-label", t("add_aria", h.title));
      add.addEventListener("click", () => {
        send({ cmd: "add", id: h.id });
        add.textContent = t("added"); add.disabled = true;
        setTimeout(() => { add.textContent = t("add"); add.disabled = lost; }, 1500);
      });
      row.append(icon(["song", "passage"].includes(h.kind) ? h.kind : "item"), txt, show, add);
      list.append(row);
    });
  }
  refreshSearchHint();
}
function refreshSearchHint() {
  const typed = typedSearch();
  let msg = "";
  if (!typed) msg = t("search_hint");
  else if (!resultsReady(state)) msg = t("searching");
  else if (!state.hits.length) msg = t("no_results");
  $("search-hint").textContent = msg;
}

function renderMessage(s) {
  $("msg-state").textContent = s.message ? t("message_showing", s.message) : "";
  $("msg-hide").classList.toggle("on", !!s.message);
  $("msg-hide").disabled = !s.message || lost;
  if (changed("message", s.message)) { msgDirty = false; }
  if (!msgDirty && document.activeElement !== $("msg")) $("msg").value = s.message;
  refreshMsgShow();
}
function refreshMsgShow() { $("msg-show").disabled = !$("msg").value.trim() || lost; }

/* the countdown ticks on the phone; the computer's clock is the reference */
let clockTimer = null;
function secondsLeft() {
  if (!state || state.countdown_ends_at === null || state.countdown_ends_at === undefined) return null;
  return Math.max(0, Math.ceil(state.countdown_ends_at - (Date.now() / 1000 + clockOffset)));
}
function fmt(sec) { return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function tickClock() {
  const left = secondsLeft();
  $("clock-pill").hidden = left === null;
  $("clock-left").textContent = left === null ? "" : fmt(left);
  if (left !== null) $("clock-pill").textContent = fmt(left);
  $("cd-stop").disabled = left === null || lost;
  if (left !== null && !clockTimer) clockTimer = setInterval(tickClock, 250);
  if (left === null && clockTimer) { clearInterval(clockTimer); clockTimer = null; }
}
function minutesValue() {
  const m = parseInt($("minutes").value, 10);
  return Number.isFinite(m) && m >= 1 && m <= 180 ? m : null;
}

/* ---------- controls ---------- */

const next = () => send({ cmd: "next" });
const back = () => send({ cmd: "prev" });
$("next-btn").addEventListener("click", next);
$("prev-btn").addEventListener("click", back);
$("text-btn").addEventListener("click", () => send({ cmd: "text" }));
$("black-btn").addEventListener("click", () => send({ cmd: "black" }));
$("live-btn").addEventListener("click", () => send({ cmd: "live" }));
$("logo-btn").addEventListener("click", () => send({ cmd: "logo" }));
$("plan-show").addEventListener("click", () => {
  if (picked === null) return;
  send({ cmd: "plan", id: picked });
  picked = null; markPicked(); refreshPlanShow(); setTab("live");
});
$("msg").addEventListener("input", () => { msgDirty = true; refreshMsgShow(); });
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("msg-show").disabled) $("msg-show").click(); });
$("msg-show").addEventListener("click", () => { send({ cmd: "message", text: $("msg").value }); msgDirty = false; });
$("msg-hide").addEventListener("click", () => { send({ cmd: "message", text: "" }); $("msg").value = ""; msgDirty = false; refreshMsgShow(); });
$("minutes").addEventListener("input", () => {
  const v = $("minutes").value.replace(/\D/g, "").slice(0, 3);
  if (v !== $("minutes").value) $("minutes").value = v;
  $("cd-start").disabled = minutesValue() === null || lost;
});
$("cd-start").addEventListener("click", () => { const m = minutesValue(); if (m !== null) send({ cmd: "countdown", minutes: m }); });
$("cd-stop").addEventListener("click", () => send({ cmd: "countdown", minutes: 0 }));

$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  refreshSearchHint();
  if (state) renderHits(state);
  searchTimer = setTimeout(() => {
    const q = typedSearch();
    if (q && q !== sentSearch) { sentSearch = q; send({ cmd: "search", text: q }, true); }
  }, 300);
});
$("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { clearTimeout(searchTimer); const q = typedSearch(); if (q) { sentSearch = q; send({ cmd: "search", text: q }, true); } e.target.blur(); }
});

document.querySelectorAll("#tabs .tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
/* a mouse click must not leave focus on a button: Space would press it again */
document.addEventListener("mousedown", (e) => { if (e.target.closest && e.target.closest("button")) e.preventDefault(); });

function jumpTo(key) {
  if (!state || !state.sections.length) return;
  const k = key === "r" ? "c" : key.toLowerCase();
  if (/^[0-9]$/.test(k)) {
    /* as on the operator: a digit is that section counted in sung order, 0 the tenth */
    const nth = state.sections[k === "0" ? 9 : Number(k) - 1];
    if (nth) send({ cmd: "goto", index: nth.slide });
    return;
  }
  const match = (x) => (x.short || "").toLowerCase().startsWith(k);
  const hits = state.sections.filter(match);
  if (!hits.length) return;
  const here = state.live === null ? -1 : state.live;
  const target = hits.find((x) => x.slide > here) || hits[0];
  send({ cmd: "goto", index: target.slide });
}

document.addEventListener("keydown", (e) => {
  if (!token || $("remote").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target;
  const typing = tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.tagName === "SELECT" || tg.isContentEditable);
  if (typing) {
    if (e.key === "Escape") { tg.blur(); if (tg.id === "search") setTab("live"); }
    return;
  }
  const k = e.key;
  let handled = true;
  if (k === " " || k === "ArrowDown" || k === "ArrowRight" || k === "PageDown") { if (!e.repeat) next(); }
  else if (k === "ArrowUp" || k === "ArrowLeft" || k === "PageUp") { if (!e.repeat) back(); }
  else if (k === "/") { setTab("search"); $("search").focus(); }
  else if (k === "F1") send({ cmd: "text" });
  else if (k === "F2") send({ cmd: "black" });
  else if (k === "F6") send({ cmd: "live" });
  else if (k === "F3") { if (state && state.logo_ready) send({ cmd: "logo" }); }
  else if (k.length === 1 && /[a-z0-9]/i.test(k) && !e.repeat) jumpTo(k);
  else handled = false;
  if (handled) e.preventDefault();
});
/* releasing Space on a focused button would click it */
document.addEventListener("keyup", (e) => {
  if (e.key === " " && token && e.target && e.target.tagName === "BUTTON") e.preventDefault();
});

$("pair-btn").addEventListener("click", () => pair($("pin").value.trim()));
$("pin").addEventListener("input", () => {
  const v = $("pin").value.replace(/\D/g, "").slice(0, 4);
  if (v !== $("pin").value) $("pin").value = v;
  if (v.length === 4) pair(v);
});
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") pair($("pin").value.trim()); });

(function init() {
  lang = pickLang();
  applyLang();
  setTab("live");
  const q = new URLSearchParams(location.search).get("pin");
  if (q) {
    try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
    pair(q.trim());
    return;
  }
  token = store(KEY, true);
  if (token) start(); else { show("pair"); $("pin").focus(); }
})();
</script>
