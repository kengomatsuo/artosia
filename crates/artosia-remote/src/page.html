<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#44445a">
<title>Artosia remote</title>
<style>
/* The look of Proclaim Remote (iOS), picked by the owner from four candidates (docs/remote.md). Skeleton from
   products/06, 07, 08 and 10 of the saved references: no tab bar; a top bar of grouped dark round-rect buttons
   around a two-segment pill; the slide full width on a dark field; a pull-up drawer of labelled thumbnails with a
   grab handle; headed groups of thumbnail rows with two stacked pills; one round floating button. Dark only.
   Red is what the room sees and nothing else; yellow is hidden or a warning; a chosen state is a fill. */
:root {
  --bar: #44445a; --field: #2f2f3f; --deep: #25252f; --band: #3d3d52; --row: #2f2f3f; --line: #44445a; --pill: #565670;
  --text: #f2f2f7; --muted: #bdbdcf; --faint: #9a9ab0;
  --blue: #5b9dff; --on-blue: #061630; --mint: #1ee6a0; --on-mint: #04271b;
  --live: #d4122e; --warn: #f7cd3a; --on-warn: #201a09;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--field); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.3; -webkit-font-smoothing: antialiased; }
body { overscroll-behavior: none; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; padding: 0; }
button:focus-visible, input:focus-visible, .prow:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
svg.ic { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* A pressed control moves a hair; the look never waits on the network. */
.press { transition: transform 80ms, filter 80ms; }
.press:not(:disabled):active { transform: scale(0.97); filter: brightness(0.88); }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
.pill:empty { display: none; }
.pill.live { background: var(--live); color: #fff; }
.pill.warn { background: var(--warn); color: var(--on-warn); }
.note { color: var(--muted); font-size: 0.8125rem; margin: 0; overflow-wrap: anywhere; }
.note:empty { display: none; }
.scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; }

/* The stacked pills of a row: Follow over Control in the source, Show over Not now or Add here. */
.stack { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; width: 96px; }
.sp { min-height: 44px; border-radius: 10px; background: var(--pill); font-weight: 600; font-size: 0.9375rem; padding: 0 8px; overflow-wrap: anywhere; line-height: 1.15; }
.sp.go { background: var(--blue); color: var(--on-blue); }
.sp.go:disabled { background: var(--pill); color: var(--muted); opacity: 1; }

/* pairing: Xbox's code cells, two rows of dark squares */
#pair { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 28px 24px; max-width: 420px; margin: 0 auto; background: var(--field); }
#pair h1 { margin: 0; font-size: 1.75rem; font-weight: 700; text-align: center; }
#pair p.lead { margin: 0; color: var(--muted); text-align: center; }
.cells { position: relative; display: grid; grid-template-columns: repeat(2, 84px); justify-content: center; gap: 12px; }
.cells .cell { height: 84px; border-radius: 10px; background: var(--deep); display: grid; place-items: center; font-size: 2.25rem; font-weight: 600; font-variant-numeric: tabular-nums; border: 2px solid transparent; }
.cells:focus-within .cell.at { border-color: var(--blue); }
#pin { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; background: none; }
#pair-error { margin: 0; min-height: 1.3em; color: var(--warn); font-weight: 600; font-size: 0.875rem; text-align: center; }
.cta { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 10px; background: var(--blue); color: var(--on-blue); font-weight: 700; font-size: 1.0625rem; width: 100%; }
.cta:disabled { background: var(--pill); color: var(--muted); opacity: 1; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--deep); border-radius: 12px; }
.seg-btn { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 4px 8px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 0.9375rem; line-height: 1.15; overflow-wrap: anywhere; }
.seg-btn.on { background: var(--pill); color: var(--text); }

#remote { height: 100dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; background: var(--field); }
/* top bar: grouped round-rect buttons, a two-segment pill between them */
#top { flex: 0 0 auto; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 12px 10px; background: var(--bar); }
.grp { display: flex; align-items: center; background: var(--deep); border-radius: 22px; height: 48px; padding: 0 2px; grid-column: 3; }
.grp button { width: 46px; height: 44px; display: grid; place-items: center; border-radius: 22px; }
.grp.solo { width: 48px; padding: 0; justify-content: center; }
#back-grp, #spacer { grid-column: 1; }
#seg2 { grid-column: 2; justify-self: center; display: flex; height: 48px; padding: 3px; background: var(--deep); border-radius: 24px; max-width: 100%; min-width: 0; }
#seg2 button { min-width: 0; padding: 0 18px; border-radius: 21px; font-weight: 600; color: var(--muted); font-size: 1rem; overflow: hidden; text-overflow: ellipsis; }
#seg2 button[aria-selected="true"] { background: #5a5a75; color: var(--text); }
/* A narrow phone gives up the spacer and some padding so the longest word of a language still fits whole. */
@media (max-width: 379px) { #top { grid-template-columns: minmax(0, 1fr) auto; } .grp { grid-column: 2; } #back-grp, #seg2 { grid-column: 1; } #spacer { display: none; } #seg2 button { padding: 0 12px; } }

#lost { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; margin: 10px 12px 0; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 18%, var(--field)); color: var(--text); }
#lost svg.ic { color: var(--warn); }
#lost b { display: block; font-size: 0.9375rem; }
#lost small { color: var(--muted); font-size: 0.8125rem; }

#screens { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }

/* live: title line, slide, state pills, Back and Next, the four states, drawer */
#stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: 10px 0 0; gap: 10px; overflow-y: auto; }
#now { display: flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 26px; }
#now b { font-size: 1.0625rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#now #count { margin-left: auto; color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
#slide { position: relative; margin: 0; background: #14141c; aspect-ratio: 16 / 9; max-height: 42vh; width: 100%; display: flex; align-items: center; justify-content: center; padding: 14px 18px; text-align: center; outline: 3px solid transparent; outline-offset: -3px; }
#slide.onair { outline-color: var(--live); }
#slide.kept { outline-color: var(--warn); }
#slide p { margin: 0; font-weight: 700; font-size: clamp(1.15rem, 5.4vw, 1.75rem); line-height: 1.25; white-space: pre-wrap; overflow-wrap: anywhere; transition: opacity 120ms; }
#slide.kept p { opacity: 0.4; }
#slide .tag { position: absolute; left: 10px; top: 8px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
#slide .tag.name { background: rgba(255,255,255,0.14); color: var(--text); }
#slide .state { position: absolute; right: 10px; top: 8px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
#steps { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px; padding: 0 14px; }
#steps button { min-height: 64px; border-radius: 14px; background: var(--pill); font-weight: 700; font-size: 1.0625rem; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
#steps button span { overflow-wrap: anywhere; }
#steps button.go { background: var(--blue); color: var(--on-blue); font-size: 1.25rem; }
#flags { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 14px; background: var(--deep); border-radius: 16px; padding: 4px; gap: 4px; }
.flag { min-height: 58px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 2px; text-align: center; line-height: 1.1; min-width: 0; }
.flag span { max-width: 100%; overflow-wrap: anywhere; }
.flag svg.ic { width: 22px; height: 22px; }
.flag.hides.on { background: var(--warn); color: var(--on-warn); }
.flag.onair.on { background: var(--live); color: #fff; }

#drawer { flex: 0 0 auto; background: var(--bar); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; max-height: 100%; }
#handle { display: grid; place-items: center; height: 26px; width: 100%; }
#handle i { display: block; width: 44px; height: 5px; border-radius: 3px; background: #7a7a94; }
#sections { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 12px 8px; flex: 0 0 auto; }
#sections::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 22px; background: var(--deep); font-weight: 600; font-size: 0.9375rem; white-space: nowrap; color: var(--text); }
.chip.live { background: var(--blue); color: var(--on-blue); }
#list { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px 12px calc(12px + env(safe-area-inset-bottom)); }
#list::-webkit-scrollbar { display: none; }
.thumb { flex: 0 0 132px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
.thumb .cap { font-size: 0.8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .tile { display: block; aspect-ratio: 16 / 9; border-radius: 6px; background: #14141c; padding: 6px 8px; font-size: 0.6875rem; line-height: 1.25; overflow: hidden; outline: 3px solid transparent; outline-offset: 0; }
.thumb.live .tile { outline-color: var(--blue); }
#drawer.onair .thumb.live .tile { outline-color: var(--live); }
#drawer.kept .thumb.live .tile { outline-color: var(--warn); }
#drawer.open { position: absolute; left: 0; right: 0; bottom: 0; top: 0; border-radius: 0; z-index: 4; }
#drawer.open #list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; overflow-y: auto; flex: 1 1 0; min-height: 0; align-content: start; }
#drawer.open .thumb { flex: initial; }
#drawer.open .thumb .tile { font-size: 0.8125rem; }

/* plan: headed groups, thumbnail rows */
#plan-list { flex: 1 1 0; padding-bottom: 96px; }
.band { padding: 12px 16px; background: var(--band); font-weight: 600; font-size: 0.9375rem; color: var(--muted); }
.prow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 84px; padding: 10px 14px; text-align: left; background: var(--row); border-bottom: 1px solid var(--line); cursor: pointer; }
.prow .th { position: relative; flex: 0 0 76px; height: 54px; border-radius: 6px; background: linear-gradient(135deg, #3b3b58, #1d1d2a); display: grid; place-items: center; color: var(--muted); }
.prow .th .pill { position: absolute; left: 4px; bottom: 4px; height: 18px; font-size: 0.6875rem; padding: 0 6px; }
.prow .meta { flex: 1 1 auto; min-width: 0; }
.prow .t { font-size: 1.0625rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .d { color: var(--muted); font-size: 0.875rem; margin-top: 2px; }
.prow .stack { display: none; }
.prow.picked { background: #3a3a54; }
.prow.picked .stack { display: flex; }
.fab { position: absolute; z-index: 3; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border-radius: 50%; background: var(--mint); color: var(--on-mint); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,0.45); }
.fab svg.ic { width: 30px; height: 30px; stroke-width: 2.4; }

/* search */
.sbox { flex: 0 0 auto; padding: 12px 14px; background: var(--field); }
.field { width: 100%; height: 48px; border-radius: 12px; border: 0; background: var(--deep); padding: 0 14px; font-size: 1rem; }
.field::placeholder { color: var(--faint); opacity: 1; }
.field:focus { outline: 2px solid var(--blue); }
.lang-pick { appearance: none; -webkit-appearance: none; color: var(--text); font: inherit; font-weight: 600; padding-right: 40px; }
[data-lang-switch] { position: relative; }
[data-lang-switch]::after { content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px; margin-top: -7px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
.lang-pick option { color: #111; background: #fff; }
#search-hint { padding: 0 16px 8px; }
#hits { flex: 1 1 0; }
.hit { display: flex; align-items: center; gap: 12px; min-height: 84px; padding: 10px 14px; background: var(--row); border-bottom: 1px solid var(--line); }
.hit .th { flex: 0 0 76px; height: 54px; border-radius: 6px; background: linear-gradient(135deg, #3b3b58, #1d1d2a); display: grid; place-items: center; color: var(--muted); }
.hit .meta { flex: 1 1 auto; min-width: 0; }
.hit .t { font-size: 1.0625rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .d { color: var(--muted); font-size: 0.875rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* more: message, countdown, language, keys */
#pane-more { padding: 14px; gap: 14px; display: flex; flex-direction: column; }
.group { background: var(--row); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; flex: 0 0 auto; }
.group h2 { margin: 0; font-size: 1.0625rem; font-weight: 700; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .sp { width: 100%; min-height: 48px; }
#msg-hide.on { background: var(--warn); color: var(--on-warn); }
.dial { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.dial .step { width: 52px; height: 52px; border-radius: 26px; background: var(--pill); display: grid; place-items: center; }
.dial .mid { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
[data-clock]:empty::before { content: "0:00"; color: var(--faint); }
.pill[data-clock]:empty::before { content: none; }
.dial [data-clock] { font-size: 2.25rem; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 2.9rem; line-height: 1.3; }
.dial .box { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.875rem; }
#minutes { width: 72px; height: 44px; border-radius: 22px; border: 0; background: var(--deep); color: var(--text); text-align: center; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
#keys-card { display: none; }
@media (hover: hover) and (pointer: fine) { #keys-card { display: flex; } }
#keys-text { line-height: 1.5; }

/* A short phone: the slide gives up height before the buttons do. */
@media (max-height: 700px) {
  #steps button { min-height: 52px; } .flag { min-height: 52px; } #stage { gap: 8px; padding-top: 8px; }
  #slide { max-height: 30vh; }
}
</style>
</head>
<body>

<!-- The icons, drawn once. Each is used by its name. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M6 6h12M12 6v12M4 20L20 4"/></symbol>
  <symbol id="i-black" viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M9 13.2 7.6 20l4.4-2 4.4 2L15 13.2"/></symbol>
  <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
  <symbol id="i-song" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.8" cy="17.5" r="2.2"/><circle cx="16.8" cy="15.5" r="2.2"/></symbol>
  <symbol id="i-passage" viewBox="0 0 24 24"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v13H6.5A1.5 1.5 0 0 0 5 18.5zM5 18.5A1.5 1.5 0 0 0 6.5 20H19"/></symbol>
  <symbol id="i-announcements" viewBox="0 0 24 24"><path d="M4 10v4h3l7 4V6l-7 4zM17.5 9.5a4 4 0 0 1 0 5"/></symbol>
  <symbol id="i-item" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-lost" viewBox="0 0 24 24"><path d="M4.5 9.5a11 11 0 0 1 15 0M7.5 13a7 7 0 0 1 9 0M12 17h.01M4 4l16 16"/></symbol>
</svg>

<main id="pair" hidden>
  <h1 data-i="pair_title">Artosia remote</h1>
  <p class="lead" data-i="pin_hint"></p>
  <div class="cells" id="cells"><div class="cell at"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" data-i-aria="pin"></div>
  <p id="pair-error" role="alert"></p>
  <button id="pair-btn" class="cta press" type="button" data-i="connect">Connect</button>
  <div data-lang-switch></div>
</main>

<main id="remote" hidden>
  <div id="top">
    <div class="grp solo" id="back-grp" hidden><button type="button" id="back" data-keep data-i-aria="tab_live"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button></div>
    <span id="spacer"></span>
    <div id="seg2" role="tablist">
      <button type="button" role="tab" data-screen="live" data-keep data-i="tab_live"></button>
      <button type="button" role="tab" data-screen="plan" data-keep data-i="tab_plan"></button>
    </div>
    <div class="grp">
      <button type="button" id="go-search" data-keep data-i-aria="tab_search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
      <button type="button" id="go-more" data-keep data-i-aria="tab_more"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></button>
    </div>
  </div>
  <div id="lost" role="status" hidden><svg class="ic" aria-hidden="true"><use href="#i-lost"/></svg><div><b data-i="lost"></b><small data-i="retrying"></small></div></div>

  <div id="screens">
    <section id="pane-live" class="screen" role="tabpanel">
      <div id="stage">
        <div id="now"><b id="title"></b><span class="pill warn" id="clock-pill" data-clock-pill data-clock hidden></span><span id="count"></span></div>
        <div id="slide"><span class="pill tag name" id="live-tag"></span><span class="pill state" id="live-state"></span><p id="live-text"></p></div>
        <div id="steps">
          <button class="press" type="button" data-act="prev"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg><span data-i="back"></span></button>
          <button class="go press" type="button" data-act="next"><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg><span data-i="next_btn"></span></button>
        </div>
        <div id="flags">
          <button class="flag hides press" type="button" data-toggle="text" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg><span data-i="clear_text"></span></button>
          <button class="flag hides press" type="button" data-toggle="black" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-black"/></svg><span data-i="black"></span></button>
          <button class="flag hides press" type="button" data-toggle="logo" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-logo"/></svg><span data-i="logo"></span></button>
          <button class="flag onair press" type="button" data-toggle="live" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-live"/></svg><span data-i="live"></span></button>
        </div>
        <p id="logo-note" class="note" style="padding:0 16px" hidden data-i="logo_needs"></p>
      </div>
      <div id="drawer">
        <button id="handle" type="button" data-keep aria-expanded="false" data-i-aria="jump"><i></i></button>
        <div id="sections" data-i-aria="jump"></div>
        <div id="list"></div>
      </div>
    </section>

    <section id="pane-plan" class="screen" role="tabpanel" hidden>
      <div id="plan-list" class="scroll"></div>
      <button class="fab press" type="button" id="fab" data-keep data-i-aria="tab_search"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
    </section>

    <section id="pane-search" class="screen" role="tabpanel" hidden>

<script>

/* Every word the page shows, in one table. Indonesian is written for a volunteer at the

const STR = {

  },

    lost: "Terputus dari komputer",

/* Names the operator sends in English, shown in the volunteer's own words. */
const LABELS_ID = [
  [/^Verse (\d+)$/i, "Bait $1"], [/^Chorus$/i, "Reff"], [/^Pre-?chorus$/i, "Pra-reff"],
  [/^Bridge( \d+)?$/i, "Bridge$1"], [/^Intro$/i, "Intro"], [/^(Ending|Outro)$/i, "Penutup"]
];
/* The languages by code. A language outside this file is added by the server below, from its table. */
const LABELS = { id: LABELS_ID };
const LANGS = [["en", "English"], ["id", "Bahasa Indonesia"]];
function addLanguage(code, name, table) {
  LANGS.push([code, name]);
  STR[code] = table;
  if (Array.isArray(table.labels)) LABELS[code] = table.labels.map(([pattern, to]) => [new RegExp(pattern, "i"), to]);
  else if (table["label.verse"]) LABELS[code] = labelRules(table);
}
/* A table names the parts of a song in plain keys. A numbered part follows label.numbered,
   where {0} is the name and {1} the number. */
function labelRules(table) {
  const part = (key, english) => table["label." + key] || english;
  const numbered = (name) => (table["label.numbered"] || "{0} {1}").replace("{0}", name).replace("{1}", "$1");
  return [
    [/^Verse (\d+)$/i, numbered(part("verse", "Verse"))],
    [/^Chorus$/i, part("chorus", "Chorus")],
    [/^Chorus (\d+)$/i, numbered(part("chorus", "Chorus"))],
    [/^Pre-?chorus$/i, part("pre_chorus", "Pre-chorus")],
    [/^Pre-?chorus (\d+)$/i, numbered(part("pre_chorus", "Pre-chorus"))],
    [/^Bridge$/i, part("bridge", "Bridge")],
    [/^Bridge (\d+)$/i, numbered(part("bridge", "Bridge"))],
    [/^Intro$/i, part("intro", "Intro")],
    [/^(Ending|Outro)$/i, part("ending", "Ending")]
  ];
}
/*EXTRA_LANGUAGES*/

const KEY = "artosia-remote-token";
const LANG_KEY = "artosia-remote-lang";
const $ = (id) => document.getElementById(id);
const $$ = (sel) => document.querySelectorAll(sel);
let token = null;
let version = 0;
let state = null;
let lost = false;
let polling = false;
let lang = "en";
let screen = "live";
let picked = null;
let clockOffset = 0;
let searchTimer = null;
let sentSearch = "";
let msgDirty = false;
let clockTimer = null;
let wake = null;

function store(name, get, value) {
  try {
    if (get) return localStorage.getItem(name);
    if (value) localStorage.setItem(name, value); else localStorage.removeItem(name);
  } catch (e) { /* storage blocked: the choice lasts for this page only */ }
  return null;
}

function t(key, ...args) {
  let s = (STR[lang] && STR[lang][key]) || STR.en[key] || key;
  args.forEach((a, i) => { s = s.replace("{" + i + "}", a); });
  return s;
}
function nice(label) {
  const rules = LABELS[lang];
  if (!rules || !label) return label;
  for (const [re, to] of rules) if (re.test(label)) return label.replace(re, to).trim();
  return label;
}

/* The listed language that fits a tag as a phone writes it ("zh-TW", "pt-PT"): the same code
   first, Chinese by its script, then any language with the same first part. The rule of
   crates/artosia-locale, kept the same here. */
function fit(tag) {
  const wanted = String(tag || "").replace(/_/g, "-").toLowerCase();
  const codes = LANGS.map(([c]) => c);
  const same = codes.find((c) => c.toLowerCase() === wanted);
  if (same) return same;
  const parts = wanted.split("-");
  const first = parts[0] === "in" ? "id" : parts[0];
  if (first === "zh") {
    const names = (list) => parts.slice(1).some((p) => list.includes(p));
    const script = !names(["hans"]) && names(["hant", "tw", "hk", "mo"]) ? "zh-hant" : "zh-hans";
    const chinese = codes.find((c) => c.toLowerCase() === script);
    if (chinese) return chinese;
  }
  return codes.find((c) => c.toLowerCase().split("-")[0] === first) || null;
}
function pickLang() {
  const saved = store(LANG_KEY, true);
  if (LANGS.some(([c]) => c === saved)) return saved;
  const asked = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  for (const tag of asked) {
    const code = fit(tag);
    if (code) return code;
  }
  return "en";
}

function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
  $$("[data-i-ph]").forEach((el) => { el.placeholder = t(el.dataset.iPh); });
  $$("[data-i-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.iAria)); });
  // Ten languages do not fit a row of buttons on a phone: one picker, each in its own name.
  $$("[data-lang-switch]").forEach((box) => {
    box.replaceChildren();
    const pick = document.createElement("select");
    pick.className = "field lang-pick"; pick.dataset.keep = "";
    pick.setAttribute("aria-label", t("language"));
    for (const [code, name] of LANGS) {
      const option = document.createElement("option");
      option.value = code; option.textContent = name; option.lang = code; option.selected = lang === code;
      pick.append(option);
    }
    pick.addEventListener("change", () => setLang(pick.value));
    box.append(pick);
  });
  resetRenderCache();
  paintScreens();
  if (state) render();
  refreshSearchHint();
  tickClock();
}
function setLang(code) {
  lang = code;
  store(LANG_KEY, false, code);
  applyLang();
}

/* ---------- screens ---------- */

function show(which) {
  $("pair").hidden = which !== "pair";
  $("remote").hidden = which !== "remote";
  if (which !== "remote") setLost(false);
}

/* Live and Plan are the two segments of the top bar; Search and More open from its icons and bring a back arrow. */
function setScreen(name) {
  screen = name;
  paintScreens();
  if (name === "search") $("search").focus();
}
function paintScreens() {
  for (const n of ["live", "plan", "search", "more"]) $("pane-" + n).hidden = n !== screen;
  $$("#seg2 button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.screen === screen)));
  const sub = screen === "search" || screen === "more";
  $("back-grp").hidden = !sub;
  $("spacer").hidden = sub;
  $("seg2").hidden = sub;
}

function setLost(v) {
  lost = v;
  $("lost").hidden = !v;
  $$("#remote button:not([data-keep])").forEach((b) => {
    if (v) { b.dataset.wasDisabled = b.disabled ? "1" : ""; b.disabled = true; }
    else if (b.dataset.wasDisabled !== undefined) { b.disabled = b.dataset.wasDisabled === "1"; delete b.dataset.wasDisabled; }
  });
  $("search").disabled = v;
  $("msg").disabled = v;
  $("minutes").disabled = v;
  if (!v && state) render();
}

/* wake lock: only exists in secure contexts, so plain http on a LAN usually has none */
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible" && !wake) {
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    }
  } catch (e) { wake = null; }
}
document.addEventListener("visibilitychange", () => { if (token) keepAwake(); });

async function pair(pin) {
  $("pair-error").textContent = "";
  try {
    const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
    if (r.ok) {
      token = (await r.json()).token;
      store(KEY, false, token);
      start();
      return;
    }
    $("pair-error").textContent = r.status === 429 ? t("too_many") : t("wrong_pin");
  } catch (e) {
    $("pair-error").textContent = t("unreachable");
  }
  show("pair");
  $("pin").value = "";
  paintCells("");
}

function start() {
  show("remote");
  paintScreens();
  keepAwake();
  if (!polling) { polling = true; poll(); }
}

function unpair() {
  token = null; version = 0; state = null;
  store(KEY, false, null);
  $("pin").value = "";
  paintCells("");
  show("pair");
}

async function poll() {
  while (token) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const r = await fetch("/api/state?since=" + version, { headers: { Authorization: "Bearer " + token }, signal: ctl.signal, cache: "no-store" });
      if (r.status === 401) { unpair(); break; }
      if (!r.ok) throw new Error("status " + r.status);
      const s = await r.json();
      if (lost) setLost(false);
      if (s.version !== version) {
        version = s.version; state = s;
        if (typeof s.now === "number") clockOffset = s.now - Date.now() / 1000;
        render();
      }
    } catch (e) {
      setLost(true);
      await new Promise((res) => setTimeout(res, 1500));
    } finally {
      clearTimeout(timer);
    }
  }
  polling = false;
}

async function send(cmd, quiet) {
  if (!token || lost) return;
  if (!quiet && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { /* ignore */ } }
  try {
    const r = await fetch("/api/command", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(cmd) });
    if (r.status === 401) unpair();
    else if (!r.ok && r.status !== 400) setLost(true);
  } catch (e) {
    setLost(true);
  }
}

/* ---------- rendering ---------- */

const cache = {};
function resetRenderCache() { for (const k of Object.keys(cache)) delete cache[k]; }
function changed(key, value) {
  const sig = JSON.stringify(value);
  if (cache[key] === sig) return false;
  cache[key] = sig;
  return true;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function icon(name) {
  /* The namespace is read off the page's own drawing: the page names no address at all. */
  const ns = document.querySelector("svg").namespaceURI;
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "ic");
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS(ns, "use");
  use.setAttribute("href", "#i-" + name);
  svg.append(use);
  return svg;
}
const groupClass = (group) => " g" + Math.min(Math.max(group | 0, 0), 5);
const kindIcon = (kind) => (["song", "passage", "announcements"].includes(kind) ? kind : "item");
const KINDS = { song: "Song", passage: "Bible passage", announcements: "Announcements", item: "Item" };

/* What the room sees: red while it sees the slide, yellow for what keeps it away. */
function view(s) {
  const n = s.slides.length, live = s.live;
  const cur = live !== null ? s.slides[live] : null;
  const kept = !cur || s.off || s.hidden || s.black || s.logo;
  return {
    live, cur, kept, onair: !kept,
    title: s.title || t("nothing_open"),
    count: n && live !== null ? t("n_of", live + 1, n) : (n ? t("n_slides", n) : ""),
    label: cur && cur.label ? nice(cur.label) : "",
    text: cur ? cur.text : t("nothing_live"),
    why: s.off ? t("projector_off") : (s.logo ? t("logo_showing") : (s.black ? t("screen_black") : (s.hidden ? t("text_cleared") : ""))),
    at: live === null ? -1 : s.sections.reduce((at, x, i) => (x.slide <= live ? i : at), -1),
  };
}

function render() {
  const s = state;
  const v = view(s);
  $("title").textContent = v.title;
  $("count").textContent = v.count;
  $("live-text").textContent = v.text;
  $("live-tag").textContent = v.label;
  $("slide").classList.toggle("onair", v.onair);
  $("slide").classList.toggle("kept", v.kept && !!v.cur);
  const st = $("live-state");
  st.className = "pill state" + (v.onair ? " live" : (v.why ? " warn" : ""));
  st.textContent = v.onair ? t("live") : v.why;
  $("drawer").classList.toggle("onair", v.onair);
  $("drawer").classList.toggle("kept", v.kept);
  renderSections(s, v);
  renderSlides(s, v);
  renderToggles(s);
  renderPlan(s);
  renderHits(s);
  renderMessage(s);
  tickClock();
  if (lost) setLost(true);
}

function renderSections(s, v) {
  const box = $("sections");
  box.hidden = !s.sections.length;
  if (changed("sections", [s.sections, lang])) {
    box.replaceChildren();
    s.sections.forEach((x) => {
      const b = el("button", "chip press", nice(x.label) || x.short);
      b.type = "button";
      b.setAttribute("aria-label", nice(x.label));
      b.addEventListener("click", () => send({ cmd: "goto", index: x.slide }));
      box.append(b);
    });
  }
  [...box.children].forEach((b, i) => {
    b.classList.toggle("live", i === v.at);
    if (i === v.at) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
  /* The chip of the part being sung stays in view when the row is longer than the phone. */
  const liveChip = box.children[v.at];
  if (liveChip && changed("liveChip", [v.at, s.sections.length]) && box.scrollWidth > box.clientWidth) {
    box.scrollTo({ left: liveChip.offsetLeft - (box.clientWidth - liveChip.offsetWidth) / 2, behavior: "smooth" });
  }
}

/* The slides as labelled thumbnails: a strip in the drawer, two columns when it is pulled up. */
function renderSlides(s, v) {
  const list = $("list");
  if (changed("slides", [s.slides, s.sections, lang])) {
    list.replaceChildren();
    s.slides.forEach((sl, i) => {
      const b = el("button", "thumb press");
      b.type = "button";
      b.append(el("span", "cap", (i + 1) + (sl.label ? " " + nice(sl.label) : "")), el("span", "tile", sl.text));
      b.addEventListener("click", () => send({ cmd: "goto", index: i }));
      list.append(b);
    });
  }
  let liveEl = null;
  [...list.children].forEach((e, i) => {
    const on = i === v.live;
    e.classList.toggle("live", on);
    if (on) { e.setAttribute("aria-current", "true"); liveEl = e; } else e.removeAttribute("aria-current");
  });
  if (liveEl && changed("liveIdx", v.live)) liveEl.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderToggles(s) {
  const on = { text: s.hidden, black: s.black, logo: s.logo, live: !s.off };
  $$("[data-toggle]").forEach((b) => {
    const lit = on[b.dataset.toggle];
    b.classList.toggle("on", lit); b.setAttribute("aria-pressed", String(lit));
  });
  const logo = document.querySelector("[data-toggle=logo]");
  logo.disabled = !s.logo_ready || lost;
  $("logo-note").hidden = s.logo_ready;
}

function renderPlan(s) {
  if (picked !== null && !s.plan.some((p) => p.id === picked && p.kind !== "heading")) picked = null;
  const list = $("plan-list");
  if (changed("plan", [s.plan, lang])) {
    list.replaceChildren();
    if (!s.plan.length) list.append(el("p", "note", t("plan_empty")));
    s.plan.forEach((p) => {
      if (p.kind === "heading") { list.append(el("div", "band", p.title)); return; }
      /* A div, not a button: the row holds the two stacked buttons that open when it is picked. */
      const row = el("div", "prow press");
      row.tabIndex = 0; row.setAttribute("role", "button"); row.dataset.id = p.id;
      const th = el("div", "th"); th.append(icon(kindIcon(p.kind)));
      if (p.live) th.append(el("span", "pill live", t("plan_live")));
      const meta = el("div", "meta"); meta.append(el("div", "t", p.title), el("div", "d", KINDS[kindIcon(p.kind)]));
      const stack = el("div", "stack");
      const go = el("button", "sp go press", t("show")); go.type = "button";
      go.setAttribute("aria-label", t("plan_show", p.title));
      go.addEventListener("click", (e) => { e.stopPropagation(); showPicked(); });
      const no = el("button", "sp press", t("cancel")); no.type = "button";
      no.addEventListener("click", (e) => { e.stopPropagation(); pick(p.id); });
      stack.append(go, no);
      row.append(th, meta, stack);
      row.addEventListener("click", () => pick(p.id));
      row.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); pick(p.id); } });
      list.append(row);
    });
  }
  const liveId = (s.plan.find((p) => p.live) || {}).id;
  list.querySelectorAll(".prow").forEach((b) => {
    const isLive = String(liveId) === b.dataset.id;
    b.classList.toggle("live", isLive);
    if (isLive) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
  markPicked();
}
function pick(id) { picked = picked === id ? null : id; markPicked(); }
function markPicked() {
  $$("#plan-list .prow").forEach((b) => {
    const on = String(picked) === b.dataset.id;
    b.classList.toggle("picked", on);
    b.setAttribute("aria-pressed", String(on));
  });
}
function showPicked() {
  if (picked === null) return;
  send({ cmd: "plan", id: picked });
  picked = null; markPicked(); setScreen("live");
}

function typedSearch() { return $("search").value.trim(); }
function resultsReady(s) { return typedSearch() !== "" && s && s.hits_for.trim().toLowerCase() === typedSearch().toLowerCase(); }

function renderHits(s) {
  const list = $("hits");
  const ready = resultsReady(s);
  if (changed("hits", [ready ? s.hits : [], ready, lang])) {
    list.replaceChildren();
    if (ready) s.hits.forEach((h) => {
      const row = el("div", "hit");
      const th = el("div", "th"); th.append(icon(kindIcon(h.kind)));
      const meta = el("div", "meta"); meta.append(el("div", "t", h.title), el("div", "d", h.detail));
      const stack = el("div", "stack");
      const showBtn = el("button", "sp go press", t("show"));
      showBtn.type = "button"; showBtn.setAttribute("aria-label", t("show_aria", h.title));
      showBtn.addEventListener("click", () => { send({ cmd: "hit", id: h.id }); setScreen("live"); });
      const add = el("button", "sp press", t("add"));
      add.type = "button"; add.setAttribute("aria-label", t("add_aria", h.title));
      add.addEventListener("click", () => {
        send({ cmd: "add", id: h.id });
        add.textContent = t("added"); add.disabled = true;
        setTimeout(() => { add.textContent = t("add"); add.disabled = lost; }, 1500);
      });
      stack.append(showBtn, add);
      row.append(th, meta, stack);
      list.append(row);
    });
  }
  refreshSearchHint();
}
function refreshSearchHint() {
  const typed = typedSearch();
  let msg = "";
  if (!typed) msg = t("search_hint");
  else if (!resultsReady(state)) msg = t("searching");
  else if (!state.hits.length) msg = t("no_results");
  $("search-hint").textContent = msg;
}

function renderMessage(s) {
  $("msg-state").textContent = s.message ? t("message_showing", s.message) : "";
  $("msg-hide").classList.toggle("on", !!s.message);
  $("msg-hide").disabled = !s.message || lost;
  if (changed("message", s.message)) { msgDirty = false; }
  if (!msgDirty && document.activeElement !== $("msg")) $("msg").value = s.message;
  refreshMsgShow();
}
function refreshMsgShow() { $("msg-show").disabled = !$("msg").value.trim() || lost; }

/* the countdown ticks on the phone; the computer's clock is the reference */
function secondsLeft() {
  if (!state || state.countdown_ends_at === null || state.countdown_ends_at === undefined) return null;
  return Math.max(0, Math.ceil(state.countdown_ends_at - (Date.now() / 1000 + clockOffset)));
}
function fmt(sec) { return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function tickClock() {
  const left = secondsLeft();
  $$("[data-clock-pill]").forEach((e) => { e.hidden = left === null; });
  $$("[data-clock]").forEach((e) => { e.textContent = left === null ? "" : fmt(left); });
  $("cd-stop").disabled = left === null || lost;
  if (left !== null && !clockTimer) clockTimer = setInterval(tickClock, 250);
  if (left === null && clockTimer) { clearInterval(clockTimer); clockTimer = null; }
}
function minutesValue() {
  const m = parseInt($("minutes").value, 10);
  return Number.isFinite(m) && m >= 1 && m <= 180 ? m : null;
}
function nudge(by) {
  $("minutes").value = Math.min(180, Math.max(1, (parseInt($("minutes").value, 10) || 1) + by));
  $("cd-start").disabled = lost;
}

/* ---------- controls ---------- */

const next = () => send({ cmd: "next" });
const back = () => send({ cmd: "prev" });
$$("[data-act=next]").forEach((b) => b.addEventListener("click", next));
$$("[data-act=prev]").forEach((b) => b.addEventListener("click", back));
$$("[data-toggle]").forEach((b) => b.addEventListener("click", () => send({ cmd: b.dataset.toggle })));
$$("#seg2 button").forEach((b) => b.addEventListener("click", () => setScreen(b.dataset.screen)));
$("back").addEventListener("click", () => setScreen("live"));
$("go-search").addEventListener("click", () => setScreen("search"));
$("go-more").addEventListener("click", () => setScreen("more"));
$("fab").addEventListener("click", () => setScreen("search"));
$("handle").addEventListener("click", () => {
  const open = $("drawer").classList.toggle("open");
  $("handle").setAttribute("aria-expanded", String(open));
});
$("msg").addEventListener("input", () => { msgDirty = true; refreshMsgShow(); });
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("msg-show").disabled) $("msg-show").click(); });
$("msg-show").addEventListener("click", () => { send({ cmd: "message", text: $("msg").value }); msgDirty = false; });
$("msg-hide").addEventListener("click", () => { send({ cmd: "message", text: "" }); $("msg").value = ""; msgDirty = false; refreshMsgShow(); });
$("minutes").addEventListener("input", () => {
  const v = $("minutes").value.replace(/\D/g, "").slice(0, 3);
  if (v !== $("minutes").value) $("minutes").value = v;
  $("cd-start").disabled = minutesValue() === null || lost;
});
$("m-less").addEventListener("click", () => nudge(-1));
$("m-more").addEventListener("click", () => nudge(1));
$("cd-start").addEventListener("click", () => { const m = minutesValue(); if (m !== null) send({ cmd: "countdown", minutes: m }); });
$("cd-stop").addEventListener("click", () => send({ cmd: "countdown", minutes: 0 }));

$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  refreshSearchHint();
  if (state) renderHits(state);
  searchTimer = setTimeout(() => {
    const q = typedSearch();
    if (q && q !== sentSearch) { sentSearch = q; send({ cmd: "search", text: q }, true); }
  }, 300);
});
$("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { clearTimeout(searchTimer); const q = typedSearch(); if (q) { sentSearch = q; send({ cmd: "search", text: q }, true); } e.target.blur(); }
});

/* a mouse click must not leave focus on a button: Space would press it again */
document.addEventListener("mousedown", (e) => { if (e.target.closest && e.target.closest("button")) e.preventDefault(); });

function jumpTo(key) {
  if (!state || !state.sections.length) return;
  const k = key === "r" ? "c" : key.toLowerCase();
  if (/^[0-9]$/.test(k)) {
    /* as on the operator: a digit is that section counted in sung order, 0 the tenth */
    const nth = state.sections[k === "0" ? 9 : Number(k) - 1];
    if (nth) send({ cmd: "goto", index: nth.slide });
    return;
  }
  const match = (x) => (x.short || "").toLowerCase().startsWith(k);
  const hits = state.sections.filter(match);
  if (!hits.length) return;
  const here = state.live === null ? -1 : state.live;
  const target = hits.find((x) => x.slide > here) || hits[0];
  send({ cmd: "goto", index: target.slide });
}

document.addEventListener("keydown", (e) => {
  if (!token || $("remote").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target;
  const typing = tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.tagName === "SELECT" || tg.isContentEditable);
  if (typing) {
    if (e.key === "Escape") { tg.blur(); if (tg.id === "search") setScreen("live"); }
    return;
  }
  const k = e.key;
  let handled = true;
  if (k === " " || k === "ArrowDown" || k === "ArrowRight" || k === "PageDown") { if (!e.repeat) next(); }
  else if (k === "ArrowUp" || k === "ArrowLeft" || k === "PageUp") { if (!e.repeat) back(); }
  else if (k === "/") { setScreen("search"); }
  else if (k === "F1") send({ cmd: "text" });
  else if (k === "F2") send({ cmd: "black" });
  else if (k === "F6") send({ cmd: "live" });
  else if (k === "F3") { if (state && state.logo_ready) send({ cmd: "logo" }); }
  else if (k.length === 1 && /[a-z0-9]/i.test(k) && !e.repeat) jumpTo(k);
  else handled = false;
  if (handled) e.preventDefault();
});
/* releasing Space on a focused button would click it */
document.addEventListener("keyup", (e) => {
  if (e.key === " " && token && e.target && e.target.tagName === "BUTTON") e.preventDefault();
});

/* The PIN is typed into a hidden box; four cells show it. */
function paintCells(v) {
  $$("#cells .cell").forEach((c, i) => { c.textContent = v[i] || ""; c.classList.toggle("at", i === Math.min(v.length, 3)); });
}
$("pair-btn").addEventListener("click", () => pair($("pin").value.trim()));
$("pin").addEventListener("input", () => {
  const v = $("pin").value.replace(/\D/g, "").slice(0, 4);
  if (v !== $("pin").value) $("pin").value = v;
  paintCells(v);
  if (v.length === 4) pair(v);
});
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") pair($("pin").value.trim()); });

(function init() {
  lang = pickLang();
  applyLang();
  const q = new URLSearchParams(location.search).get("pin");
  if (q) {
    try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
    pair(q.trim());
    return;
  }
  token = store(KEY, true);
  if (token) start(); else { show("pair"); $("pin").focus(); }
})();
</script>
</body>
