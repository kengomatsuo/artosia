[package]
name = "artosia-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Artosia-setup.exe: a small per-user setup that fetches the signed release with artosia-update."

[[bin]]
name = "Artosia-setup"
path = "src/main.rs"

[dependencies]
artosia-update = { path = "../artosia-update" }
serde_json = "1"

# Only the example `looks` (the four window directions, SETUPUI1) draws with Rune. A dev-dependency
# is never built into Artosia-setup.exe.
[dev-dependencies]
rune.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
