[package]
name = "artosia-update"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Self-update from a static HTTPS folder with a signed manifest. No UI."

[dependencies]
# Blocking HTTP client, pure Rust TLS (rustls + ring), the same build artosia-lyrics uses.
ureq = "3.5"
# Ed25519 verification and SHA-256; already in the tree through ureq's TLS.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[lints]
workspace = true
