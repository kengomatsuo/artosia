[package]
name = "artosia-slides"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "What the projector and the stage screen draw, shared by the operator's previews and the output process."

[dependencies]
artosia-core = { path = "../artosia-core" }
base64 = "0.22.1"
rune.workspace = true
# The list of installed font families; Rune has none. Already built for Rune's own use.
fontique = { version = "0.12", default-features = false, features = ["std", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
